apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: role-assignment
  module: formspec.core
  description: "Role assignment (auth) — penetapan role ke user dalam konteks App tertentu."
  annotations:
    formspec.dev/ui-exposed: "true"
spec:
  version: v1
  plural: role-assignments
  characteristic: master
  fields:
    - name: user_id
      type: string
      required: true
      index: true
    - name: role_id
      type: string
      required: true
      index: true
    - name: app
      type: string
      index: true
    - name: active
      type: boolean
      default: true