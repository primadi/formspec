apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: user
  module: formspec.core
  description: "User account (auth) — role contract: username (unique) + password_hash. Extra fields (display_name, email, roles, permissions, active) adalah default shape; override user hanya perlu field kontrak."
  annotations:
    formspec.dev/ui-exposed: "true"
spec:
  version: v1
  plural: users
  characteristic: master
  display_field: username
  fields:
    - name: username
      type: string
      required: true
      unique: true
      index: true
    - name: password
      type: string
      masked: true
      description: "Plaintext password (create) — di-hash ke password_hash oleh hook before create/update"
    - name: password_hash
      type: string
      required: true
      masked: true
    - name: display_name
      type: string
    - name: email
      type: string
      index: true
      description: "Email — dipakai untuk OAuth login (find-or-create by email). Hanya email yang verified (email_verified=true) yang bisa di-link via OAuth (anti account pre-hijacking)."
    - name: email_verified
      type: boolean
      default: false
      description: "Apakah email sudah dibuktikan dimiliki — via link verifikasi email (registrasi) atau klaim email_verified dari provider OAuth. OAuth login hanya link ke email verified."
    - name: oauth_provider
      type: string
      index: true
      description: "Nama provider OAuth yang ter-link (mis. google) — identitas eksternal akun ini."
    - name: oauth_sub
      type: string
      index: true
      description: "Subject id dari provider OAuth (klaim sub) — bersama oauth_provider membentuk identitas eksternal unik."
    - name: roles
      type: json
    - name: permissions
      type: json
    - name: active
      type: boolean
      default: true
    - name: status
      type: string
      default: active
      description: "active | pending | disabled — pending tidak bisa login sampai di-approve admin"
  hooks:
    - on: before
      action: create
      impl:
        type: native
        ref: formspec.core.user.hash-password
    - on: before
      action: update
      impl:
        type: native
        ref: formspec.core.user.hash-password