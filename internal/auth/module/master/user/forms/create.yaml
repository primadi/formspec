apiVersion: formspec.dev/v1
kind: Form
metadata:
  name: user-create
  module: formspec.core
  description: "Form buat user — username + password (di-hash) + profil + role"
spec:
  entity: user
  render:
    mode: separate_page
  sections:
    - title: "Akun"
      description: "Kredensial login"
      fields:
        - field: username
          label: "Username"
          placeholder: "mis. budi"
        - field: password
          label: "Password"
          placeholder: "Minimal 8 karakter"
          help: "Di-hash otomatis (bcrypt) — tidak pernah disimpan plaintext"
    - title: "Profil"
      description: "Informasi tambahan"
      fields:
        - field: display_name
          label: "Nama Tampilan"
          placeholder: "Nama lengkap user"
        - field: email
          label: "Email"
          placeholder: "contoh@email.com"
    - title: "Akses"
      description: "Role & permission langsung (opsional — bisa juga via Role Assignment)"
      fields:
        - field: roles
          label: "Roles"
          widget: tags
          placeholder: "Ketik nama role, tekan Enter"
          help: "Daftar nama role — ketik lalu Enter untuk menambah, X untuk menghapus"
        - field: permissions
          label: "Permissions"
          widget: tags
          placeholder: "Ketik permission, tekan Enter"
          help: "Permission string — ketik lalu Enter untuk menambah, X untuk menghapus, mis. *"
        - field: active
          label: "Aktif"
          help: "Nonaktifkan untuk memblokir login"
        - field: status
          label: "Status"
          help: "active | pending | disabled — pending tidak bisa login sampai di-approve"
  submit:
    label: "Buat User"
    message: "User berhasil dibuat"