# formspec-operator Deployment (docs/runtimes/03-formspec-operator.md §5).
# 2 replicas with leader election: one active, one standby.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formspec-operator
  namespace: formspec-system
  labels:
    app.kubernetes.io/name: formspec-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: formspec-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: formspec-operator
    spec:
      serviceAccountName: formspec-operator
      containers:
        - name: operator
          image: registry.formspec.dev/formspec-operator:0.1.0
          args:
            - --leader-elect
            - --control-cluster-url=$(CONTROL_CLUSTER_URL)
            - --resource-image=formahub/formspec-resource:0.1.0
          env:
            - name: CONTROL_CLUSTER_URL
              value: ""
          ports:
            - name: metrics
              containerPort: 8443
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
