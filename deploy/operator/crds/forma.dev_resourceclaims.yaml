# ResourceClaim CRD — a signed permission grant: which datastore a
# workspace may access (docs/architecture/06-k8s-operator.md §3.4). The
# operator verifies the ed25519 signature and the datastore's
# allowedTenants before the workspace pod gets credentials.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: resourceclaims.forma.dev
spec:
  group: forma.dev
  scope: Namespaced
  names:
    kind: ResourceClaim
    listKind: ResourceClaimList
    plural: resourceclaims
    singular: resourceclaim
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Datastore
          type: string
          jsonPath: .spec.datastore
        - name: Workspace
          type: string
          jsonPath: .spec.workspace
        - name: Permission
          type: string
          jsonPath: .spec.permission
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [datastore, workspace]
              properties:
                datastore:
                  type: string
                workspace:
                  type: string
                permission:
                  type: string
                  enum: [read-only, read-write]
                grantedBy:
                  type: string
                grantedAt:
                  type: string
                signature:
                  type: string
                  description: >-
                    Hex-encoded ed25519 signature over
                    "datastore|workspace|permission|grantedBy|grantedAt",
                    signed by the datastore owner.
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
