# Datastore CRD — registers an external DB/cache/queue with the cluster
# (docs/architecture/06-k8s-operator.md §3.3). Credentials live in the
# referenced Secret; the operator only validates presence.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datastores.formspec.dev
spec:
  group: formspec.dev
  scope: Namespaced
  names:
    kind: Datastore
    listKind: DatastoreList
    plural: datastores
    singular: datastore
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Driver
          type: string
          jsonPath: .spec.driver
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Validated
          type: string
          jsonPath: .status.conditions[?(@.type=="Validated")].status
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [driver, endpointSecretRef]
              properties:
                driver:
                  type: string
                  enum: [sqlite, postgres, valkey, redis, s3, minio, nats, memory, fs]
                endpointSecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                allowedTenants:
                  type: array
                  items:
                    type: string
                owner:
                  type: string
                ownerPublicKey:
                  type: string
                  description: Hex-encoded ed25519 public key used to verify ResourceClaim signatures.
                capacity:
                  type: object
                  properties:
                    maxConnections:
                      type: integer
                      format: int32
                    storageGB:
                      type: integer
                      format: int32
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
