# ClusterClass CRD — SLA/pricing tier definitions authored by the Cloud
# Owner (docs/architecture/06-k8s-operator.md §3.1). Pure configuration:
# no status subresource, never reconciled into K8s resources directly.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterclasses.formspec.dev
spec:
  group: formspec.dev
  scope: Cluster
  names:
    kind: ClusterClass
    listKind: ClusterClassList
    plural: clusterclasses
    singular: clusterclass
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: SLA
          type: string
          jsonPath: .spec.sla
        - name: Node Type
          type: string
          jsonPath: .spec.nodeType
        - name: Min Replicas
          type: integer
          jsonPath: .spec.scaling.minReplicas
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sla:
                  type: string
                region:
                  type: string
                availability:
                  type: string
                nodeType:
                  type: string
                storage:
                  type: string
                maxWorkspaces:
                  type: integer
                  format: int32
                features:
                  type: array
                  items:
                    type: string
                scaling:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                      format: int32
                      minimum: 0
                    scaleToZero:
                      type: boolean
                pricing:
                  type: object
                  properties:
                    currency:
                      type: string
                    baseMonthly:
                      type: integer
                      format: int64
                    perWorkspace:
                      type: integer
                      format: int64
                    perGBStorage:
                      type: integer
                      format: int64
