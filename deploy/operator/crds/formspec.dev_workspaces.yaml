# Workspace CRD — one Workspace maps to one formspec-resource Deployment
# (docs/architecture/06-k8s-operator.md §3.2).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.formspec.dev
spec:
  group: formspec.dev
  scope: Namespaced
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    singular: workspace
    shortNames: [ws]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.clusterClass
        - name: Environment
          type: string
          jsonPath: .spec.environment
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [clusterClass]
              properties:
                owner:
                  type: string
                  description: Workspace owner key fingerprint.
                region:
                  type: string
                clusterClass:
                  type: string
                cluster:
                  type: string
                  description: "Enterprise only: pin a specific cluster."
                environment:
                  type: string
                  enum: [prod, staging, dev]
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                datastores:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                cache:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
