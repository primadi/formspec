apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: warehouse
  module: inventory
  description: Gudang / lokasi penyimpanan
spec:
  version: v1
  characteristic: master

  fields:
    - name: code
      type: string
      natural_key: true
      immutable: true
      unique: true
      rules: [required]
    - name: name
      type: string
      rules: [required]
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: company.branch }
      description: Cabang pemilik gudang ini — cross-app relation ke App "company"
    - name: is_active
      type: boolean
      default: true
