apiVersion: formspec.dev/v1alpha1
kind: App
metadata:
  name: inventory
  description: Inventory management — multi-warehouse stock tracking
spec:
  version: 1.0.0
  vendor: formspec-dev
  root_url: /app/inventory
  modules: [inventory]
  menu:
    - type: module
      module: inventory
  publishes:
    - service: stock-movements
      actions: [create, apply]
  consumes:
    - app: company
      service: branch-directory
      actions: [read]
