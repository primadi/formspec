# Customer detail page — full view with related address list
apiVersion: formspec.dev/v1alpha1
kind: Page
metadata:
  name: customer-detail
  module: billing
  description: Halaman detail pelanggan + alamat terkait
spec:
  route: /customers/:id
  title: "Pelanggan — {customer.name}"
  permissions: [customers.view]
  blocks:
    - form:
        ref: customer-view
        entity: customer
        id: ":id"
        mode: view
    - table:
        ref: customer-address-table
        entity: address
        param:
          customer_id: ":id"
