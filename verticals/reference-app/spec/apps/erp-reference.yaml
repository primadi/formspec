apiVersion: forma.dev/v1alpha1
kind: App
metadata:
  name: erp-reference
  description: >
    Dev-mode composition of every vertical under verticals/ — NOT the
    production path. Run compose.sh first (see README.md). Production
    composition is per-App `forma apply` into one workspace.
spec:
  version: 1.0.0
  vendor: forma-dev
  root_url: /app/erp-reference
  modules:
    [
      company,
      billing,
      inventory,
      gl,
      notifications,
      sales-inventory-integrator,
      sales-gl-integrator,
    ]
  # Adopt each composed vertical's own default menu suggestion (Core Basic
  # §4.4/§4.5) — company/notifications/sales-*-integrator have none, so
  # there's nothing to adopt for them (matches the pre-migration experience:
  # they never shipped a kind: Menu either).
  menu:
    - type: module
      module: billing
    - type: module
      module: gl
    - type: module
      module: inventory
