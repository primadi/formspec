apiVersion: forma.dev/v1alpha1
kind: Config
metadata:
  name: app
  module: core
  description: App-level config untuk erp-reference (merged from each composed vertical)
spec:
  keys:
    workspace_name:
      type: string
      default: "default"
    order_number_prefix:
      type: string
      default: "ORD"
      description: Prefix nomor order per workspace
    default_currency:
      type: string
      default: "IDR"
