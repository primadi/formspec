apiVersion: formspec.dev/v1
kind: Subscription
metadata:
  name: order-to-movement
  module: sales-inventory-integrator
  description: Auto-create stock movement (type=out) setiap order dibayar — connects billing to inventory
spec:
  # Beraksi lewat HANDLER — lihat catatan yang sama di sales-gl-integrator.
  events:
    - billing.order.paid
  handler:
    type: native
    ref: "SalesInventoryIntegrator.CreateOutMovementHandler"
