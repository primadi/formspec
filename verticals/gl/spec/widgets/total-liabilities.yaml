# Total liabilities widget
apiVersion: formspec.dev/v1alpha1
kind: Widget
metadata:
  name: total-liabilities
  module: gl
spec:
  title: "Total Liabilitas"
  type: metric
  entity: ledger
  query: "account_type = 'liability'"
  refresh_secs: 300
  config:
    aggregate: sum
    field: ending_balance
    format: currency
