# Total assets widget
apiVersion: forma.dev/v1alpha1
kind: Widget
metadata:
  name: total-assets
  module: general-ledger
spec:
  title: "Total Aset"
  type: metric
  entity: ledger
  query: "account_type = 'asset'"
  refresh_secs: 300
  config:
    aggregate: sum
    field: ending_balance
    format: currency
