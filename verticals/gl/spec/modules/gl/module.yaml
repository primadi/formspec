apiVersion: formspec.dev/v1
kind: Module
metadata:
  name: gl
  description: Double-entry accounting core
spec:
  version: 1.0.0
  vendor: formspec-dev
  depends:
    - module: formspec/core
  config:
    default_currency: IDR
    fiscal_year_start: "01-01"
  # Default menu suggestion (Core Basic §4.5) — migrated from the old
  # standalone kind: Menu (spec/menus/gl-menu.yaml). "Jurnal Umum"/"Buku
  # Besar"/"Laba Rugi"/"Neraca" have no authored View backing them yet in
  # this vertical, so they stay on the `route` escape hatch unchanged.
  menu:
    - label: "Akuntansi"
      icon: "calculator"
      order: 30
      children:
        - { label: "Dashboard", icon: "dashboard", view: gl-dashboard, order: 1 }
        - { label: "Jurnal Umum", icon: "book", route: "/app/gl/journal", order: 2 }
        - { label: "Buku Besar", icon: "book-open", route: "/app/gl/ledger", order: 3 }
        - label: "Laporan"
          icon: "file-text"
          order: 4
          children:
            - { label: "Neraca Saldo", view: trial-balance }
            - { label: "Laba Rugi", route: "/app/gl/reports/income-statement" }
            - { label: "Neraca", route: "/app/gl/reports/balance-sheet" }
