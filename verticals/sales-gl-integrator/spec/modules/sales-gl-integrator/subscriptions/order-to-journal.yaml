apiVersion: formspec.dev/v1
kind: Subscription
metadata:
  name: order-to-journal
  module: sales-gl-integrator
  description: Auto-create journal entry setiap order dibayar — connects billing to gl
spec:
  # Beraksi lewat HANDLER. Handler Subscription sudah berjalan di worker outbox
  # (at-least-once), jadi ia SENDIRI adalah eksekusi latar — tidak perlu
  # `queue` + `job` lagi (itu konsekuensi milik publisher, bukan consumer).
  events:
    - billing.order.paid
  handler:
    type: native
    ref: "SalesGlIntegrator.CreateSalesJournalHandler"
