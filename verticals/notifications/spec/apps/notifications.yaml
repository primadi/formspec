apiVersion: formspec.dev/v1
kind: App
metadata:
  name: notifications
  description: WhatsApp notification reactions — subscribes to billing.order events
spec:
  version: 1.0.0
  vendor: formspec-dev
  root_url: /app/notifications
  modules: [notifications]
  consumes:
    - app: billing
      service: order-events
      actions: [read]
