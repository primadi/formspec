volumes:
  minio-data:

networks:
  formspec-net:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    ports:
      - "18080:8080"
    networks:
      - formspec-net
    depends_on:
      - valkey
      - minio

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "11025:1025"   # SMTP
      - "18025:8025"   # Web UI
    networks:
      - formspec-net

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    ports:
      - "19000:9000"   # API
      - "19001:9001"   # Console
    volumes:
      - minio-data:/data
    env_file:
      - .env
    command: server /data --console-address ":9001"
    networks:
      - formspec-net

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - formspec-net
