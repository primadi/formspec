volumes:
  garage-data:
  # Cache Go di-persist supaya `Rebuild Container` tidak mengosongkannya.
  # GOMODCACHE sendiri di layer container: cold cache memaksa download ~200 MB
  # zip modul (≈1 GB setelah diekstrak) plus cache build ~1.3 GB, dan fase
  # download itu yang membuat `make lint` / `go build ./...` pertama tampak
  # freeze (golangci-lint tidak mencetak apa pun sementara Go menunggu).
  # Hapus kapan saja: docker volume rm <project>_go-mod-cache <project>_go-build-cache
  go-mod-cache:
  go-build-cache:

networks:
  formspec-net:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ../..:/workspaces:cached
      # Cache Go persisten antar-rebuild — lihat docs_internal/plan/devcontainer-go-cache-lint.md.
      # Docker menyalin isi + ownership (vscode:golang) dari image saat volume
      # pertama kali dibuat, jadi cache hangat di image tidak hilang.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
    command: sleep infinity
    ports:
      - "18080:8080"
    networks:
      - formspec-net
    depends_on:
      - valkey
      - garage

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "11025:1025" # SMTP
      - "18025:8025" # Web UI
    networks:
      - formspec-net

  # Object storage (S3-compatible) — the default `garage` datastore driver.
  # `--single-node --default-bucket` sets up the cluster layout and creates the
  # access key + bucket from the GARAGE_DEFAULT_* vars in .env on first boot.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    ports:
      - "19000:3900" # S3 API
      - "19003:3903" # Admin API + Prometheus metrics
    volumes:
      - garage-data:/var/lib/garage
      - ./garage.toml:/etc/garage.toml:ro
    env_file:
      - .env
    command: /garage server --single-node --default-bucket
    networks:
      - formspec-net

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - formspec-net
