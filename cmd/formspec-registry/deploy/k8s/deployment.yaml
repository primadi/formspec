# FormSpec Module Registry — K8s deployment (vanilla, Plan C batch 2).
# 3 stateless replicas behind a Service; state lives in Postgres + object
# storage; Redis/Valkey backs ctx.cache for MRU module metadata.
#
# Apply order: secret → deployment → service → ingress.
# Prereqs: Postgres reachable at postgres:5432 (HA per platform/10 §6),
#          Valkey at valkey:6379, ingress-nginx + cert-manager installed.
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-secrets
  namespace: formspec
type: Opaque
stringData:
  # openssl rand -hex 32 — atau inject dari secret manager (production).
  jwt-hmac-secret: "CHANGE_ME_dev_only_use_asymmetric_in_prod"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formspec-registry
  namespace: formspec
  labels: { app: formspec-registry }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: formspec-registry }
  template:
    metadata:
      labels: { app: formspec-registry }
    spec:
      containers:
        - name: registry
          image: formspec-registry:latest
          args:
            - --dsn
            - postgres://formspec@postgres:5432/formspec_registry?sslmode=require
            - --prod
            - --addr
            - ":8080"
            - --jwt-public-key
            - /etc/formspec/jwt/jwt.pub
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9102 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: jwt-keys, mountPath: /etc/formspec/jwt, readOnly: true }
      volumes:
        - name: jwt-keys
          secret:
            secretName: registry-jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: formspec-registry
  namespace: formspec
spec:
  selector: { app: formspec-registry }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9102, targetPort: metrics }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: formspec-registry
  namespace: formspec
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 64m   # tarball upload ≤ 50MB
spec:
  ingressClassName: nginx
  tls:
    - hosts: [registry.formspec.dev]
      secretName: registry-tls
  rules:
    - host: registry.formspec.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: formspec-registry
                port: { number: 80 }
