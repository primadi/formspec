apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: vendor
  module: registry
  description: "Vendor — penerbit module (identitas ed25519 untuk signature)"
spec:
  version: v1
  characteristic: master
  lifecycle: plain_crud
  display_field: name
  plural: vendors
  fields:
    - name: name
      type: string
      required: true
      unique: true
      title: "Vendor Name"
      description: "Nama unik vendor, mis. acme"
    - name: display_name
      type: string
      required: true
      title: "Display Name"
    - name: public_key
      type: text
      required: true
      title: "Ed25519 Public Key"
      description: "Public key ed25519 (base64) yang memverifikasi signature module vendor ini"
    - name: owner_username
      type: string
      title: "Owner"
      description: "Username akun registry yang mengelola vendor ini (diisi saat sign-up vendor)"
    - name: url
      type: string
      title: "URL"
    - name: status
      type: string
      default: pending
      title: "Status"
      description: "pending | active | rejected — vendor harus di-approve admin sebelum bisa publish module"
  cache:
    ttl: 300s

  actions:
    - name: approve
      description: "Approve aplikasi vendor — aktifkan vendor + grant role vendor ke owner"
      required_permission: registry.vendors.update
      impl:
        type: native
        ref: registry.vendor.approve
      expose: [rest]

  expose:
    - type: rest
      actions: [list, find, create, submit]
