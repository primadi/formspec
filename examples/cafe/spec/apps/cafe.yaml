apiVersion: formspec.dev/v1
kind: App
metadata:
  name: cafe
  description: "Aplikasi Kafe — pesanan, pembayaran, dan laporan penjualan"
  labels:
    domain: cafe
spec:
  version: 1.0.0
  vendor: formspec
  root_url: /app/kafe
  modules:
    - cafe-master
    - cafe-order
    - cafe-report
  menu:
    - label: "Dashboard"
      icon: "layout-dashboard"
      module: cafe-report
      view: cafe-summary-dashboard
    - type: module
      module: cafe-order
    - label: "Laporan"
      icon: "bar-chart-3"
      children:
        - label: "Rekap Penjualan"
          icon: "table"
          module: cafe-report
          view: sales-recap-report
    - type: module
      module: cafe-master