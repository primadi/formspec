apiVersion: formspec.dev/v1alpha1
kind: Entity
metadata:
  name: menu-item
  module: cafe-master
  description: "Item menu kafe — produk yang dijual beserta harga dan ketersediaan"
spec:
  version: v1
  characteristic: master
  lifecycle: plain_crud
  display_field: name
  plural: menu-items
  fields:
    - name: code
      type: string
      required: true
      unique: true
      title: "Kode Menu"
      description: "Kode unik item, contoh M-001"
    - name: name
      type: string
      required: true
      title: "Nama Item"
    - name: category
      type: enum
      enum_values: [food, drink, dessert]
      required: true
      title: "Kategori"
    - name: price
      type: money
      required: true
      title: "Harga"
    - name: is_available
      type: boolean
      default: true
      title: "Tersedia"
      description: "False untuk item yang tidak dijual sementara"
    - name: description
      type: text
      title: "Deskripsi"
  actions:
    - name: submit
      disabled: true
  expose:
    - type: rest
      actions: [list, find, create, update, delete]
