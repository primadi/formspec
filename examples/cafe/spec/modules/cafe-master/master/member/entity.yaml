apiVersion: formspec.dev/v1alpha1
kind: Entity
metadata:
  name: member
  module: cafe-master
  description: "Anggota kafe — pelanggan terdaftar"
spec:
  version: v1
  characteristic: master
  lifecycle: plain_crud
  display_field: name
  plural: members
  fields:
    - name: code
      type: string
      required: true
      unique: true
      title: "Kode Anggota"
      description: "Kode unik anggota, contoh C-001"
    - name: name
      type: string
      required: true
      title: "Nama"
    - name: phone
      type: string
      title: "Telepon"
    - name: email
      type: string
      title: "Email"
    - name: join_date
      type: date
      title: "Tanggal Bergabung"
  actions:
    - name: submit
      disabled: true
  expose:
    - type: rest
      actions: [list, find, create, update, delete]
