apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: order
  module: cafe-order
  description: "Pesanan kafe — transaksi utama dengan daftar item dan total"
spec:
  version: v1
  characteristic: transaction
  lifecycle: plain_crud
  display_field: order_number
  plural: orders
  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
      title: "Tanggal Pesanan"
    - name: order_number
      type: string
      required: true
      unique: true
      title: "No. Pesanan"
      description: "Kode unik pesanan, contoh ORD-20260811-001"
    - name: table_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.table }
      title: "Meja"
    - name: member_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.member }
      title: "Anggota"
    - name: items
      type: child
      child:
        storage: jsonb
        sequence_field: line_number
        fields:
          - { name: line_number, type: integer, immutable: true }
          - name: menu_item_id
            type: relation
            relation: { type: belongs_to, resource: cafe-master.menu-item }
            rules: [required]
          - { name: quantity, type: integer, rules: [required, positive] }
          - { name: unit_price, type: money, rules: [required, positive] }
          - { name: line_total, type: money, rules: [required, positive] }
    - name: total_amount
      type: money
      required: true
      title: "Total"
    - name: status
      type: enum
      enum_values: [open, paid, cancelled]
      default: open
      index: true
      title: "Status"
    - name: note
      type: text
      title: "Catatan"
  state_machine:
    field: status
    initial: open
    states:
      - { name: open, label: "Terbuka" }
      - { name: paid, label: "Lunas" }
      - { name: cancelled, label: "Dibatalkan" }
    transitions:
      - { from: open, to: paid, via: settle }
      - { from: open, to: cancelled, via: cancel }
  actions:
    - name: submit
      disabled: true
    - name: settle
      description: "Tandai pesanan lunas setelah pembayaran tercatat"
      required_permission: cafe-order.order.settle
      audit: true
    - name: cancel
      description: "Batalkan pesanan yang masih terbuka"
      required_permission: cafe-order.order.cancel
      audit: true
  expose:
    - type: rest
      actions: [list, find, create, update, delete]
