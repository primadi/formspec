apiVersion: formspec.dev/v1
kind: Dashboard
metadata:
  name: cafe-summary-dashboard
  module: cafe-report
  description: "Ringkasan kafe — pesanan terbuka, lunas, pembayaran pending, dan meja tersedia"
spec:
  title: "Dashboard Kafe"
  realtime: true
  refresh: 60
  widgets:
    - { ref: open-orders, layout: { x: 0, y: 0, w: 3, h: 1 } }
    - { ref: paid-orders, layout: { x: 3, y: 0, w: 3, h: 1 } }
    - { ref: pending-payments, layout: { x: 6, y: 0, w: 3, h: 1 } }
    - { ref: available-tables, layout: { x: 9, y: 0, w: 3, h: 1 } }
