# ── FormSpec Dev Config ──
# This file configures `formspec dev` and `formspec serve`.
# It is NOT a kind: Config manifest — it is CLI tooling config only.
#
# See docs/spec/platform/08-project-layout.md for the full reference.

spec: spec
dsn: sqlite:.formspec/cafe.db
dev-ui: true          # enable dev UI (formspec.dev) in dev mode
dev-auth: true         # enable real JWT auth in dev mode (login + authorization enforced)
jwt-secret: change-me  # HMAC secret for JWT signing — set a fixed value so
#                        # issued tokens survive server restarts. Keep it secret;
#                        # for production prefer env/secret manager over this file.
# runtime: node          # uncomment if you have an app/ sidecar
# app-dir: app
# app-entrypoint: src/app.ts
# dev: true
