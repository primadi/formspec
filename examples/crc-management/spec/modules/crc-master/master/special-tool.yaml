apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: special-tool
  module: crc-master
  description: "Master alat khusus (Special Tools)"
spec:
  version: v1
  characteristic: master
  display_field: tool_name
  fields:
    - name: tool_name
      type: string
      required: true
      title: "Nama Tool"
    - name: part_no
      type: string
      title: "Part No"
    - name: quantity
      type: integer
      default: 1
      title: "Qty"
  soft_deactivate:
    enabled: true
  expose:
    - type: rest
      actions: [list, find, create, update]
