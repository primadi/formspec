apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: component-type
  module: crc-master
  description: "Klasifikasi tipe komponen alat berat — Powertrain dan Hydraulic components"
spec:
  version: v1
  characteristic: reference
  fields:
    - name: code
      type: string
      required: true
    - name: name
      type: string
      required: true
    - name: category
      type: string
      required: true
      description: "Kategori utama: Powertrain atau Hydraulic"
    - name: description
      type: text
    - name: is_active
      type: boolean
      default: true
