apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: work-type
  module: crc-master
  description: "Jenis pekerjaan checklist (Disassemble, Cleaning, Inspection, Assemble, Testing, Installation, General, DCI)"
spec:
  version: v1
  characteristic: reference
  display_field: name
  plural: work-types
  fields:
    - name: code
      type: string
      required: true
      unique: true
      title: "Kode"
    - name: name
      type: string
      required: true
      title: "Nama Work Type"
    - name: sequence
      type: integer
      default: 0
      title: "Urutan"
  expose:
    - type: rest
      actions: [list, find]
