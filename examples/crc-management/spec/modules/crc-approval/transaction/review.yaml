apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: review
  module: crc-approval
  description: "Review oleh Foreman/Reviewer pada tahapan Stop and Go — dapat Approve, Revise, memberikan performance score, dan catatan"
spec:
  version: v1
  characteristic: transaction
  fields:
    - name: transaction_date
      type: date
      required: true
      description: "Tanggal review — required untuk transaction characteristic"
    - name: review_number
      type: string
      required: true
      description: "Nomor review unik"
    - name: submission
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-submission }
      required: true
    - name: section
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-section }
      required: true
      description: "Section yang sedang direview (Stop and Go gate)"
    - name: reviewer_id
      type: string
      required: true
      description: "User ID Foreman/Reviewer"
    - name: review_decision
      type: string
      required: true
      description: "Approve atau Revise"
    - name: performance_score
      type: integer
      description: "Skor performa teknisi (1-100)"
    - name: notes
      type: text
      description: "Catatan review — alasan revise, feedback, dll."
    - name: reviewed_at
      type: datetime
    - name: next_section_order
      type: integer
      description: "Section berikutnya jika Approved; 0 jika revisi ke section saat ini"
