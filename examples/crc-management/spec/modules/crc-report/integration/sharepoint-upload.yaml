apiVersion: formspec.dev/v1
kind: Service
metadata:
  name: sharepoint-upload
  module: crc-report
  description: "Unggah PDF final ke SharePoint Service Engineering — auto-folder WorkType/DocType/Year"
spec:
  version: v1
  actions:
    - name: upload
      description: "Upload PDF ke folder SharePoint (Level1 WorkType / Level2 DocType / Level3 Year)"
      required_permission: crc-report.sharepoint-upload.upload
      audit: true
    # Pembalik `upload` (7.7.2): dipanggil saat dokumen dibatalkan, supaya
    # arsipnya tidak tertinggal. Idempoten — menghapus berkas yang sudah tidak
    # ada bukan kegagalan, jadi retry aman.
    - name: remove
      description: "Tarik arsip PDF dari SharePoint (pembalik upload saat dokumen dibatalkan)"
      required_permission: crc-report.sharepoint-upload.remove
      idempotent: true
      audit: true
