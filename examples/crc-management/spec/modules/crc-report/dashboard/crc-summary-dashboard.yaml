apiVersion: formspec.dev/v1
kind: Dashboard
metadata:
  name: crc-summary-dashboard
  module: crc-report
  description: "Summary Report — melacak status seluruh dokumen checklist"
spec:
  title: "CRC Summary Report"
  realtime: true
  refresh: 60
  widgets:
    - { ref: doc-in-progress, layout: { x: 0, y: 0, w: 3, h: 1 } }
    - { ref: doc-waiting-review, layout: { x: 3, y: 0, w: 3, h: 1 } }
    - { ref: doc-waiting-approval, layout: { x: 6, y: 0, w: 3, h: 1 } }
    - { ref: doc-completed, layout: { x: 9, y: 0, w: 3, h: 1 } }
