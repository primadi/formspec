apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: checklist-task
  module: crc-checklist
  description: "Task inspeksi yang diterima User — hasil dari schedule yang sudah di-assign. User mencari dan mengisi task ini di aplikasi lapangan."
spec:
  version: v1
  characteristic: transaction
  fields:
    - name: transaction_date
      type: date
      required: true
      description: "Tanggal task dibuat — required untuk transaction characteristic"
    - name: task_number
      type: string
      required: true
    - name: schedule
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.inspection-schedule }
      required: true
    - name: template
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-template }
      required: true
    - name: assigned_to
      type: string
      required: true
      description: "User ID teknisi"
    - name: status
      type: string
      default: "Draft"
      description: "Draft, In Progress, Waiting Review, Waiting Approval, Completed, Revised"
    - name: current_section_order
      type: integer
      default: 1
      description: "Section yang sedang dikerjakan (sequential)"
    - name: started_at
      type: datetime
    - name: completed_at
      type: datetime
    - name: is_offline_draft
      type: boolean
      default: false
      description: "Apakah task disimpan sebagai draft offline"
