apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: submission-field-value
  module: crc-checklist
  description: "Nilai yang diisi user untuk setiap field dalam submission — menyimpan jawaban text, number, file URL, foto, tanda tangan"
spec:
  version: v1
  characteristic: transaction
  fields:
    - name: transaction_date
      type: date
      required: true
    - name: submission
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-submission }
      required: true
    - name: field
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-field }
      required: true
    - name: section
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-section }
      required: true
    - name: value_text
      type: text
      description: "Nilai untuk textbox, textarea"
    - name: value_number
      type: number
      description: "Nilai untuk number field"
    - name: value_boolean
      type: boolean
      description: "Nilai untuk checkbox"
    - name: value_json
      type: json
      description: "Nilai untuk multiple_checklist, dropdown multi-select"
    - name: file_url
      type: string
      description: "URL file upload / foto"
    - name: file_name
      type: string
      description: "Nama file asli yang diupload"
    - name: filled_by
      type: string
      description: "User ID yang mengisi field ini (untuk multi-user)"
    - name: filled_at
      type: datetime
