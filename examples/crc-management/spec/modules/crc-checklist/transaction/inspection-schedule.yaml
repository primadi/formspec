apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: inspection-schedule
  module: crc-checklist
  description: "Jadwal inspeksi yang diberikan ke User (Serviceman/Warehouseman)"
spec:
  version: v1
  characteristic: transaction
  fields:
    - name: transaction_date
      type: date
      required: true
      description: "Tanggal jadwal inspeksi — required untuk transaction characteristic"
    - name: schedule_number
      type: string
      required: true
      description: "Nomor jadwal unik"
    - name: job_identity
      type: relation
      relation: { type: belongs_to, resource: crc-master.job-identity }
      required: true
    - name: template
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-template }
      required: true
    - name: assigned_to
      type: string
      required: true
      description: "User ID teknisi yang ditugaskan"
    - name: scheduled_date
      type: date
      required: true
    - name: due_date
      type: date
    - name: priority
      type: string
      default: "Normal"
      description: "Normal, High, Urgent"
    - name: notes
      type: text
