apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: checklist-template
  module: crc-checklist
  description: "Master template checklist yang dirancang oleh Admin — berisi section, field, workflow config, dan panduan visual"
spec:
  version: v1
  characteristic: master
  fields:
    - name: template_code
      type: string
      required: true
      description: "Kode unik template (cth: TMPL-ENG-001)"
    - name: template_name
      type: string
      required: true
    - name: revision_date
      type: date
      required: true
    - name: revision_number
      type: integer
      default: 1
    - name: work_type
      type: relation
      relation: { type: belongs_to, resource: crc-master.work-type }
      required: true
    - name: component_type
      type: relation
      relation: { type: belongs_to, resource: crc-master.component-type }
      required: true
    - name: model
      type: relation
      relation: { type: belongs_to, resource: crc-master.model }
    - name: responsible_by
      type: string
      description: "Penanggung jawab template"
    - name: process
      type: relation
      relation: { type: belongs_to, resource: crc-master.process-type }
    - name: status
      type: string
      description: "Active, Inactive, Archived"
      default: "Active"
    - name: doc_number_prefix
      type: string
      description: "Prefix untuk nomor dokumen yang dihasilkan"
    - name: guide_image_url
      type: text
      description: "URL gambar panduan visual untuk teknisi"
    - name: workflow_config
      type: json
      description: "Konfigurasi alur persetujuan dalam format JSON — urutan section, approver roles, dll."
