apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: checklist-section
  module: crc-checklist
  description: "Bagian (section) dalam template checklist — Document Header, General Section, Specific Section, Approval List"
spec:
  version: v1
  characteristic: master
  fields:
    - name: template
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-template }
      required: true
    - name: section_code
      type: string
      required: true
      description: "Kode section: HEADER, GENERAL, SPECIFIC, APPROVAL"
    - name: section_name
      type: string
      required: true
    - name: section_type
      type: string
      required: true
      description: "Tipe section: document_header, general, specific, approval_list"
    - name: sequence_order
      type: integer
      required: true
      description: "Urutan section dalam template"
    - name: is_mandatory
      type: boolean
      default: true
      description: "Apakah section wajib diisi sebelum lanjut ke section berikutnya"
    - name: stop_and_go
      type: boolean
      default: false
      description: "Apakah section ini memerlukan review Foreman (Stop and Go gate)"
    - name: description
      type: text
