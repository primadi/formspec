apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: checklist-field
  module: crc-checklist
  description: "Field definition dalam section checklist — mendukung Textbox, TextArea, Checkbox, Dropdown, File Upload, Take/Upload Picture, Tabel"
spec:
  version: v1
  characteristic: master
  fields:
    - name: section
      type: relation
      relation: { type: belongs_to, resource: crc-checklist.checklist-section }
      required: true
    - name: field_code
      type: string
      required: true
    - name: field_label
      type: string
      required: true
    - name: field_type
      type: string
      required: true
      description: "Jenis field: textbox, textarea, checkbox, dropdown, multiple_checklist, file_upload, picture, table, number, date, signature"
    - name: sequence_order
      type: integer
      required: true
    - name: is_mandatory
      type: boolean
      default: false
      description: "Wajib diisi — jika true, muncul pop-up warning jika terlewat"
    - name: default_value
      type: string
    - name: options
      type: json
      description: "Opsi untuk dropdown/checkbox dalam format JSON array"
    - name: validation_rule
      type: string
      description: "Aturan validasi (regex, min/max, dll)"
    - name: help_text
      type: text
      description: "Teks bantuan / tooltip untuk field"
    - name: visible_when
      type: string
      description: "FormaExpr — kondisi field ditampilkan"
    - name: readonly_when
      type: string
      description: "FormaExpr — kondisi field readonly"
    - name: max_file_size
      type: integer
      description: "Maksimum ukuran file upload (MB)"
    - name: allowed_file_types
      type: string
      description: "Ekstensi file yang diizinkan (csv: .pdf,.jpg,.png)"
