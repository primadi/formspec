apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: product
  module: catalog
  description: "Produk yang dijual di toko online"
spec:
  version: v1
  characteristic: master
  lifecycle: plain_crud
  display_field: name
  plural: products
  fields:
    - name: code
      type: string
      required: true
      unique: true
      title: "Kode"
      description: "Kode unik produk, contoh P-001"
    - name: name
      type: string
      required: true
      title: "Nama"
    - name: category
      type: enum
      enum_values: [elektronik, fashion, rumah]
      required: true
      title: "Kategori"
    - name: price
      type: money
      required: true
      title: "Harga"
    - name: is_available
      type: boolean
      default: true
      title: "Tersedia"
      description: "False untuk produk yang tidak dijual sementara"
    - name: description
      type: text
      title: "Deskripsi"
  actions:
    - name: submit
      disabled: true
  expose:
    - type: rest
      actions: [list, find, create, update, delete]
