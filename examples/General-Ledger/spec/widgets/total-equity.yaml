# Total equity widget
apiVersion: forma.dev/v1alpha1
kind: Widget
metadata:
  name: total-equity
  module: general-ledger
spec:
  title: "Total Ekuitas"
  type: metric
  entity: ledger
  query: "account_type = 'equity'"
  refresh_secs: 300
  config:
    aggregate: sum
    field: ending_balance
    format: currency
