# SHOWCASE kind: Page varian TABS + Configuration Page pattern (§3 spec frontend).
# Tiap tab = Form mode edit atas entity `setting` (characteristic: reference)
# dengan id berisi natural key value — misal "clinic", "billing".
# Renderer: tanpa tombol New/Delete, hanya Update.
#
# CATATAN: Entity `setting` punya natural_key field `key` (strategy: custom).
# Backend GetByID otomatis resolve dari UUID → _key fallback. Saat pertama
# kali diakses tanpa record yang cocok, HandleFind auto-create record dengan
# natural key value + field defaults.
apiVersion: forma.dev/v1alpha1
kind: Page
metadata:
  name: system-settings
  module: clinic
  description: Pengaturan sistem — tabs, satu form per grup setting
spec:
  route: /settings
  title: "Pengaturan Sistem"
  icon: "settings"
  permissions: [settings.update]
  tabs:
    - label: "Klinik"
      form: { ref: settings-clinic, id: "clinic", mode: edit }
    - label: "Billing & Struk"
      form: { ref: settings-billing, id: "billing", mode: edit }
