# SHOWCASE: characteristic summary — proyeksi baca-saja (read-only via API,
# tanpa menu derived). Dulu menjadi sumber data Widget/Dashboard; karena
# projection engine (recompute otomatis) belum diimplementasikan, widget
# dashboard kini membaca entity live `clinic/visit` — lihat
# docs/plan/fix-clinic-dashboard-summary.md.
# Router hanya generate list + find untuk summary. Tidak dapat menu derived.
apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: daily-visit-summary
  module: clinic
  description: Agregat harian kunjungan & pendapatan per poliklinik
spec:
  version: v1
  characteristic: summary

  auth: { required: true, strategies: [token] }

  fields:
    - name: date
      type: date
      required: true
      index: true
    - name: polyclinic_id
      type: relation
      relation: { type: belongs_to, resource: polyclinic }
    - name: visit_count
      type: integer
      default: 0
    - name: completed_count
      type: integer
      default: 0
    - name: revenue
      type: decimal
      default: 0
