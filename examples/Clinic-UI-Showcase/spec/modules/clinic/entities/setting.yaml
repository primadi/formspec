# SHOWCASE: Configuration Page pattern (§3 spec frontend).
# characteristic: reference → renderer TIDAK boleh render tombol "New"/"Delete";
# hanya Update. Satu row per grup setting (id: "clinic", id: "billing"),
# di-edit lewat pages/system-settings.yaml (Page tabs + Form mode: edit).
apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: setting
  module: clinic
  description: Pengaturan sistem — struktur dikunci developer, nilai diubah admin
spec:
  version: v1
  characteristic: reference

  auth: { required: true, strategies: [token] }
  expose:
    - { type: rest, enabled: true }

  fields:
    - name: key
      type: string
      required: true
      natural_key: true
      natural_key_rule:
        strategy: custom
      description: "Natural key per grup setting — misal 'clinic', 'billing'"
      exclude: [ui]
    - name: clinic_name
      type: string
      rules: [max_length: 120]
    - name: address
      type: string
      rules: [max_length: 500]
    - name: phone
      type: string
    - name: queue_prefix
      type: string
      rules: [max_length: 4]
    - name: tax_percent
      type: decimal
      rules: [min: 0, max: 100]
    - name: enable_whatsapp
      type: boolean
      default: false
    - name: whatsapp_number
      type: string
      description: Wajib bila enable_whatsapp — required_when di form
    - name: receipt_footer
      type: string

  actions:
    # Reference/config data tanpa lifecycle → plain CRUD (§1.7 spec frontend):
    # tombol "Simpan Pengaturan" saja, tanpa Submit/draft.
    - name: submit
      disabled: true
