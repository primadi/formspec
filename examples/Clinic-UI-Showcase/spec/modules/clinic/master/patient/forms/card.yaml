# SHOWCASE kind: Form dipakai mode VIEW sebagai block di Page (patient-detail).
# BlockRef.mode: view membuat semua field readonly — form yang sama bisa
# dipakai view/edit tergantung konteks block.
apiVersion: formspec.dev/v1
kind: Form
metadata:
  name: patient-card
  module: clinic
  description: Kartu profil pasien — subset field untuk halaman detail
spec:
  entity: patient
  sections:
    - title: "Profil"
      fields:
        - { field: nik, label: "NIK" }
        - { field: name, label: "Nama" }
        - { field: birth_date, label: "Tgl. Lahir" }
        - { field: gender, label: "Jenis Kelamin" }
        - { field: blood_type, label: "Gol. Darah" }
    - title: "Kontak & Lainnya"
      fields:
        - { field: phone, label: "No. HP" }
        - { field: address, label: "Alamat" }
        - { field: allergies, label: "Alergi" }
        - { field: is_bpjs, label: "Peserta BPJS" }
