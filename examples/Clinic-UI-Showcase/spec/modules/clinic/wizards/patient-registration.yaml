# SHOWCASE kind: Wizard — proses 3 langkah (§11 spec frontend):
# step form → step form ber-depends_on → step commit action.
# Renderer: stepper, step di URL (?step=2), back selalu boleh,
# step N+1 terkunci sebelum N selesai, final submit = SATU action server
# (visit.register-patient) yang atomik.
apiVersion: forma.dev/v1alpha1
kind: Wizard
metadata:
  name: patient-registration
  module: clinic
  description: Pendaftaran pasien — cari/buat pasien, pilih poli & dokter, konfirmasi
spec:
  title: "Pendaftaran Pasien"
  entity: visit
  action: register-patient      # commit atomik seluruh state wizard (§11)
  allow_partial_save: true      # draft/resume — lanjut dari step terakhir bila dibuka ulang
  steps:
    - title: "Data Pasien"
      description: "Cari pasien lama atau daftarkan pasien baru"
      layout: search_select
      entity: patient
      search_fields: [nik, name, phone]
      allow_create: true        # tombol "Pasien Baru" → form modal
      form: patient-quick-create
    - title: "Pilih Poli & Dokter"
      description: "Dropdown dokter ter-filter poliklinik terpilih"
      form: visit-quick
      depends_on: polyclinic_id
    - title: "Konfirmasi"
      description: "Ringkasan sebelum commit atomik"
      summary:
        - { label: "Pasien", field: patient.name }
        - { label: "Poliklinik", field: polyclinic.name }
        - { label: "Dokter", field: doctor.name }
      action: register-patient
