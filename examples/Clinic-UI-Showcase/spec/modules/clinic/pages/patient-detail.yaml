# SHOWCASE kind: Page — route ber-:param + multi-block:
# form view-mode + table ter-filter param + widget + html block.
# Meng-exercise: BlockRef.id dari route param, BlockRef.param passing,
# title interpolation FormaExpr ("{patient.name}").
apiVersion: forma.dev/v1alpha1
kind: Page
metadata:
  name: patient-detail
  module: clinic
  description: Detail pasien — profil, riwayat kunjungan, rekam medis
spec:
  route: /app/patients/:id
  title: "Pasien — {patient.name}"
  icon: "user"
  permissions: [patients.view]
  blocks:
    - form:
        ref: patient-card
        entity: patient
        id: ":id"
        mode: view
    - table:
        ref: visit-table
        entity: visit
        param: { patient_id: ":id" }
    - html: |
        <p class="text-muted">Riwayat lengkap rekam medis tersedia di
        <a href="/timeline/patient-medical-history?patient_id=:id">Timeline Rekam Medis</a>.</p>
