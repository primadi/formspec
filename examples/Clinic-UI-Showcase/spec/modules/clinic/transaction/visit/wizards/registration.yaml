# SHOWCASE kind: Wizard — proses 3 langkah (§11 spec frontend):
# step form → step form ber-depends_on → step ringkasan.
# Renderer: stepper, step di URL (?step=2 & instance=<id>, autosave ke
# localStorage), back selalu boleh, step N+1 terkunci bila `required` step
# sebelumnya belum terisi. Pasien baru dibuat eager di step 1 (patient.create
# langsung, lepas dari kelanjutan wizard) — jadi final submit tinggal plain
# create ke entity visit, tanpa custom action. on_complete.restart membawa
# loket langsung ke pendaftaran berikutnya, banner menampilkan nomor antrian
# dari response submit terakhir.
apiVersion: formspec.dev/v1alpha1
kind: Wizard
metadata:
  name: patient-registration
  module: clinic
  description: Pendaftaran pasien — cari/buat pasien, pilih poli & dokter, konfirmasi
spec:
  title: "Pendaftaran Pasien"
  entity: visit
  on_complete:
    restart: true               # langsung siap daftarkan pasien berikutnya (loket)
    banner:
      - { label: "Nomor Antrian", field: response.queue_number }
      - { label: "Nama Pasien", field: response.patient.name }
  steps:
    - title: "Data Pasien"
      description: "Cari pasien lama atau daftarkan pasien baru"
      layout: search_select
      entity: patient
      search_fields: [nik, name, phone]
      allow_create: true        # tombol "Pasien Baru" → form modal, patient.create langsung
      form: patient-quick-create
      required: [patient_id]
    - title: "Pilih Poli & Dokter"
      description: "Dropdown dokter ter-filter poliklinik terpilih"
      form: visit-quick
      depends_on: polyclinic_id
      required: [polyclinic_id, doctor_id]
    - title: "Konfirmasi"
      description: "Ringkasan sebelum membuat kunjungan"
      summary:
        - { label: "Pasien", field: patient.name }
        - { label: "Poliklinik", field: polyclinic.name }
        - { label: "Dokter", field: doctor.name }
