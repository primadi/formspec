# SHOWCASE kind: Widget tipe metric dengan format currency.
# Baca entity transaksi `visit` langsung (sum total), bukan summary entity —
# summary projection belum diimplementasikan (lihat docs/plan/fix-clinic-dashboard-summary.md).
apiVersion: formspec.dev/v1alpha1
kind: Widget
metadata:
  name: revenue-today
  module: clinic
  description: Pendapatan hari ini
spec:
  title: "Pendapatan Hari Ini"
  type: metric
  entity: visit
  query: "transaction_date = today() and status != 'cancelled'"
  refresh_secs: 60
  config:
    aggregate: sum
    field: total
    format: currency
    currency: IDR
