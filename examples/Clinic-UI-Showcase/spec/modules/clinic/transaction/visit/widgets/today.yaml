# SHOWCASE kind: Widget tipe metric — jumlah kunjungan hari ini.
# Baca entity transaksi `visit` langsung (count), bukan summary entity —
# summary projection belum diimplementasikan (lihat docs/plan/fix-clinic-dashboard-summary.md).
apiVersion: formspec.dev/v1
kind: Widget
metadata:
  name: visits-today
  module: clinic
  description: Jumlah kunjungan hari ini
spec:
  title: "Kunjungan Hari Ini"
  type: metric
  entity: visit
  query: "transaction_date = today() and status != 'cancelled'"
  refresh_secs: 60
  config:
    aggregate: count
