# SHOWCASE kind: Widget tipe chart — line chart 30 hari dari entity live `visit`.
# Tanpa `config.y` → renderer menghitung jumlah kunjungan per (hari, poliklinik).
apiVersion: forma.dev/v1alpha1
kind: Widget
metadata:
  name: visits-by-polyclinic
  module: clinic
  description: Tren kunjungan per poliklinik
spec:
  title: "Kunjungan per Poliklinik"
  type: chart
  entity: visit
  query: "status != 'cancelled'"
  refresh_secs: 300
  config:
    chart_type: line
    x: transaction_date
    group_by: polyclinic_id
    range: 30d
