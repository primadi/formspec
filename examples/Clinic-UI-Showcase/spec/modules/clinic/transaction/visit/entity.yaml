# SHOWCASE: dokumen transaksi flagship — state machine + child table + natural key
# + custom actions ber-script + event realtime. Lifecycle default (submit aktif)
# → pola "2-step + auto-save" (§1.7 spec frontend).
# UI-nya di-override penuh: tables/visit-table.yaml, forms/visit-edit.yaml,
# kanbans/consultation-board.yaml, prints/queue-ticket.yaml.
apiVersion: formspec.dev/v1alpha1
kind: Entity
metadata:
  name: visit
  module: clinic
  description: Kunjungan pasien — dari antrian sampai selesai konsultasi
spec:
  version: v1
  characteristic: transaction

  # Governance: jendela entry transaction_date (3 hari ke belakang). Staf dengan
  # visits.resolve-stale boleh melewati batas (path khusus) tanpa memperlebar
  # policy — lihat docs/plan/backdate-override-resolve-stale.md.
  backdate_policy:
    max_days_back: 3
    override_permission: visits.resolve-stale

  auth: { required: true, strategies: [token] }

  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
    - name: queue_number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      natural_key_rule:
        strategy: sequence
        format: "{prefix}{year}{month}{day}-{seq:03d}"
        prefix: { config: clinic.queue_prefix, default: "Q" }
        reset: daily
    - name: queue_position
      type: integer
      description: Posisi urutan dalam kolom Kanban — nullable, diisi via drag-to-reorder
    - name: patient_id
      type: relation
      relation: { type: belongs_to, resource: patient }
      required: true
    - name: polyclinic_id
      type: relation
      relation: { type: belongs_to, resource: polyclinic }
      required: true
    - name: doctor_id
      type: relation
      relation: { type: belongs_to, resource: doctor }
      required: true
    - name: complaint
      type: string
      rules: [required, max_length: 1000]
    - name: diagnosis
      type: string
      rules: [max_length: 2000]
    - name: status
      type: enum
      enum_values: [waiting, in_consultation, completed, cancelled]
      index: true
    - name: is_stale
      type: boolean
      description: Kunjungan menggantung — transaction_date melewati backdate limit dan belum selesai/batal
      computed:
        formula: 'status not in ("completed", "cancelled") and transaction_date < days_ago(backdate_limit_days)'
    - name: stale_label
      type: string
      description: Label badge untuk kartu stale di board
      computed:
        formula: '"⚠ Stale" if (status not in ("completed", "cancelled") and transaction_date < days_ago(backdate_limit_days)) else ""'
    - name: treatments
      type: child
      child:
        storage: jsonb
        sequence_field: line_number
        fields:
          - { name: line_number, type: integer, immutable: true }
          - { name: treatment_name, type: string, rules: [required] }
          - { name: quantity, type: integer, rules: [required, positive] }
          - { name: price, type: decimal, rules: [required, positive] }
    - name: total
      type: decimal
      # min: 0 — a completed visit without treatments legitimately totals 0
      # (the old `positive` rule rejected 0 and blocked completing such visits).
      rules: [min: 0]
    - name: started_at
      type: datetime
    - name: completed_at
      type: datetime

  state_machine:
    field: status
    initial: waiting
    transitions:
      - { from: waiting, to: in_consultation, via: start-consultation }
      - { from: in_consultation, to: completed, via: complete,
          guard: { expression: "not empty(diagnosis)", message: "Diagnosis harus diisi sebelum konsultasi selesai" } }
      - { from: in_consultation, to: completed, via: resolve-stale,
          guard: { expression: "not empty(diagnosis)", message: "Diagnosis harus diisi sebelum menyelesaikan kunjungan stale" } }
      - { from: in_consultation, to: waiting, via: recall,
          guard: { expression: "empty(diagnosis) and empty(treatments)", message: "Tidak bisa recall — sudah ada diagnosis atau tindakan yang diberikan" } }
      - { from: [waiting, in_consultation], to: cancelled, via: cancel }

  actions:
    - name: update
      conditions:
        - script: "status in ['waiting', 'in_consultation']"
          message: "Kunjungan yang selesai/batal tidak bisa diedit"

    - name: delete
      disabled: true

    - name: start-consultation
      description: Pasien dipanggil masuk ruang konsultasi
      required_permission: visits.start-consultation
      audit: true
      ui:
        confirm: "Panggil pasien ini ke ruang konsultasi?"
      impl: { type: script_ref, ref: start-consultation }

    - name: complete
      description: Konsultasi selesai — diagnosis wajib terisi (guard state machine)
      required_permission: visits.complete
      audit: true
      emits: completed
      impl: { type: script_ref, ref: complete }

    - name: resolve-stale
      description: "Selesaikan kunjungan stale (melewati backdate policy) — path khusus, diaudit"
      required_permission: visits.resolve-stale
      audit: true
      emits: completed-overdue
      ui:
        confirm: "Selesaikan kunjungan stale ini? Ini pengecualian yang diaudit."
      impl: { type: script_ref, ref: resolve-stale }

    - name: cancel
      description: Batalkan kunjungan
      required_permission: visits.cancel
      audit: true
      ui:
        confirm: "Batalkan kunjungan ini? Nomor antrian hangus."
      impl: { type: script_ref, ref: cancel }

    - name: recall
      description: "Tarik kembali pasien ke antrian — koreksi kesalahan pemanggilan"
      required_permission: visits.recall
      audit: true
      ui:
        confirm: "Kembalikan pasien ke antrian? Pastikan belum ada pemeriksaan yang dilakukan."
      impl: { type: script_ref, ref: recall }

  # Wizard patient-registration (§11 spec frontend) commits via a plain
  # create — no custom action needed. The patient is created eagerly in
  # step 1 (a normal patient.create, independent of wizard completion), so
  # by the final "Konfirmasi" step every required field (patient_id,
  # polyclinic_id, doctor_id, complaint, transaction_date) is already known.

  events:
    - name: completed
      type: async
      description: Konsultasi selesai — realtime board + summary
      payload:
        fields: [id, queue_number, patient_id, doctor_id, total, completed_at]
      deliver:
        - channel: audit_log
        - channel: websocket
          target: { scope: workspace }

    - name: completed-overdue
      type: async
      description: Konsultasi stale diselesaikan via path khusus — hilir tahu ini pengecualian
      payload:
        fields: [id, queue_number, patient_id, doctor_id, total, completed_at]
      deliver:
        - channel: audit_log
        - channel: websocket
          target: { scope: workspace }
