# SHOWCASE kind: Form — form terpadat: render separate_page (dokumen padat +
# child table, §1.6), multi-section, FormSpecExpr visible_when/required_when,
# read_only, help/placeholder, submit config. Ini form yang MENG-OVERRIDE
# derived form untuk entity visit.
apiVersion: formspec.dev/v1alpha1
kind: Form
metadata:
  name: visit-edit
  module: clinic
  description: Form edit kunjungan — separate page, section + child grid
spec:
  entity: visit
  render: separate_page
  sections:
    - title: "Kunjungan"
      fields:
        - field: transaction_date
          label: "Tanggal Kunjungan"
        - field: queue_number
          label: "No. Antrian"
          read_only: true
          help: "Digenerate otomatis saat simpan (natural key, reset harian)"
        - field: patient_id
          label: "Pasien"
        - field: polyclinic_id
          label: "Poliklinik"
        - field: doctor_id
          label: "Dokter"
    - title: "Konsultasi"
      description: "Diisi dokter saat konsultasi berlangsung"
      fields:
        - field: complaint
          label: "Keluhan"
          placeholder: "Keluhan utama pasien…"
        - field: diagnosis
          label: "Diagnosis"
          # Diagnosis hanya relevan & wajib begitu konsultasi dimulai —
          # FormSpecExpr dievaluasi client-side, UX only (§6 spec).
          visible_when: "fields.status != 'waiting'"
          required_when: "fields.status == 'in_consultation'"
    - title: "Tindakan & Biaya"
      fields:
        - field: treatments
          label: "Tindakan"
          widget: child-grid
        - field: total
          label: "Total"
          read_only: true
          compute: "sum([t.quantity * t.price for t in fields.treatments])"
          visible_when: "fields.treatments != None and len(fields.treatments) > 0"
  submit:
    label: "Simpan Kunjungan"
    message: "Kunjungan tersimpan"
    redirect: "/app/visits"
