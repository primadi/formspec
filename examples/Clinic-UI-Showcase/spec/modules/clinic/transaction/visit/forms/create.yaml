# SHOWCASE kind: Form — create mode dengan multi-kolom layout (§1.6):
# section pertama 2 kolom (data kunjungan), section kedua 1 kolom (keluhan),
# section ketiga 2 kolom (biaya).
# Dipilih oleh resolveForm() untuk mode create karena naming pattern:
# {entity.name}-create = visit-create.
apiVersion: formspec.dev/v1alpha1
kind: Form
metadata:
  name: visit-create
  module: clinic
  description: Form create kunjungan — multi-section, 2 kolom
spec:
  entity: visit
  sections:
    - title: "Data Kunjungan"
      columns: 2
      fields:
        - field: transaction_date
          label: "Tanggal Kunjungan"
        - field: patient_id
          label: "Pasien"
        - field: polyclinic_id
          label: "Poliklinik"
        - field: doctor_id
          label: "Dokter"
    - title: "Keluhan"
      columns: 1
      fields:
        - field: complaint
          label: "Keluhan Awal"
          placeholder: "Keluhan utama pasien…"
    - title: "Biaya & Status"
      columns: 2
      fields:
        - field: total
          label: "Total Biaya"
        - field: status
          label: "Status"
  submit:
    label: "Simpan Kunjungan Baru"
