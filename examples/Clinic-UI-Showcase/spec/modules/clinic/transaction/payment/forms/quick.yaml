# SHOWCASE kind: Form — modal + pola 1-step create-submit (§1.7)
# + required_when/visible_when bergantung nilai field lain (FormaExpr).
apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: payment-quick
  module: clinic
  description: Terima pembayaran — quick entry kasir
spec:
  entity: payment
  render: modal
  sections:
    - title: "Pembayaran"
      fields:
        - field: visit_id
          label: "Kunjungan"
        - field: amount
          label: "Jumlah"
        - field: method
          label: "Metode"
        - field: reference
          label: "No. Referensi"
          help: "Wajib untuk pembayaran non-tunai"
          visible_when: "fields.method != 'cash'"
          required_when: "fields.method != 'cash'"
  submit:
    label: "Terima & Simpan"
    message: "Pembayaran diterima"
