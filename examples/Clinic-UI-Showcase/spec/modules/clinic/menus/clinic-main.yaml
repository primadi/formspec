# SHOWCASE kind: Menu — nested 2 level, icon lucide, order, route.
# Item yang backing permission-nya tidak dimiliki user harus hilang otomatis (§1.4).
# CATATAN: patient/doctor/polyclinic sengaja TIDAK ada di sini —
# renderer harus menambahkan derived module menu untuk entity yang
# belum tercakup Menu manapun (engine/derive.ts).
apiVersion: forma.dev/v1alpha1
kind: Menu
metadata:
  name: clinic-main
  module: clinic
  description: Navigasi utama modul clinic
spec:
  label: "Klinik"
  icon: "stethoscope"
  order: 10
  children:
    - label: "Dashboard"
      icon: "layout-dashboard"
      route: "/dashboard/clinic-dashboard"
      order: 1
    - label: "Pendaftaran Pasien"
      icon: "user-plus"
      route: "/wizard/patient-registration"
      order: 2
    - label: "Kunjungan"
      icon: "clipboard-list"
      route: "/clinic/visits"
      order: 3
      children:
        - label: "Daftar Kunjungan"
          icon: "list"
          route: "/clinic/visits"
        - label: "Board Konsultasi"
          icon: "columns-3"
          route: "/kanban/consultation-board"
    - label: "Kasir"
      icon: "wallet"
      route: "/clinic/payments"
      order: 4
    - label: "Laporan Pendapatan"
      icon: "bar-chart-3"
      route: "/report/revenue-by-polyclinic"
      order: 5
    - label: "Pengaturan"
      icon: "settings"
      route: "/clinic/settings"
      order: 9
      when: "user.has('clinic.settings.update')"   # kondisi bisnis FormaExpr (§9)
