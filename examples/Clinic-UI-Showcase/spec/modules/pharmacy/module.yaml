apiVersion: formspec.dev/v1alpha1
kind: Module
metadata:
  name: pharmacy
  description: Farmasi — obat, resep, antrian peracikan
spec:
  version: 1.0.0
  depends:
    - module: formspec/core
    - module: clinic
  # Default menu suggestion (Core Basic §4.5) — see clinic/module.yaml for
  # the full explanation. Migrated from the old
  # spec/modules/pharmacy/menus/pharmacy-main.yaml.
  menu:
    - label: "Farmasi"
      icon: "pill"
      children:
        - { label: "Antrian Resep", icon: "columns-3", view: pharmacy-queue }
        - label: "Semua Resep"
          icon: "list"
          route: "/pharmacy/prescriptions" # derived entity-list route (no authored View)
        - label: "Jual Bebas (OTC)"
          icon: "shopping-cart"
          route: "/pharmacy/otc-sales" # derived entity-list route (no authored View)
