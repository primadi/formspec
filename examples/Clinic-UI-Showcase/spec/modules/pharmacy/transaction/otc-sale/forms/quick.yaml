# SHOWCASE kind: Form — modal quick-create untuk penjualan OTC. Alur: create
# (status pending) → kasir klik action "sell" di halaman record untuk
# menyelesaikan transaksi (idiom "create idle, script action finalizes" yang
# sama dipakai visit/prescription).
apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: otc-sale-quick
  module: pharmacy
  description: Penjualan obat bebas — quick create
spec:
  entity: otc-sale
  render: modal
  sections:
    - title: "Penjualan"
      fields:
        - { field: transaction_date, label: "Tanggal" }
        - { field: patient_id, label: "Pasien Terdaftar", help: "Opsional" }
        - { field: buyer_name, label: "Nama Pembeli", placeholder: "Opsional — boleh kosong untuk pembeli anonim" }
        - { field: items, label: "Item", widget: child-grid }
        - { field: notes, label: "Catatan" }
