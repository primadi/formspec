# SHOWCASE: transaksi dengan relation LINTAS MODULE (clinic.visit) +
# state machine 4 kolom untuk kanban antrian farmasi (contoh kanonik §12 spec).
# Resep bisa berasal dari kunjungan internal (visit_id) ATAU resep luar
# (source: external + prescriber_name) — visit_id sengaja tidak required.
# hooks: before/create menunjukkan cross-module resource.fetch (§0 fix).
apiVersion: formspec.dev/v1alpha1
kind: Entity
metadata:
  name: prescription
  module: pharmacy
  description: Resep — antrian peracikan sampai penyerahan obat
spec:
  version: v1
  characteristic: transaction

  auth: { required: true, strategies: [token] }

  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
    - name: number
      type: string
      natural_key: true
      immutable: true
      unique: true
      natural_key_rule:
        strategy: sequence
        format: "RX-{year}{month}{day}-{seq:03d}"
        reset: daily
    - name: visit_id
      type: relation
      relation: { type: belongs_to, resource: clinic.visit }
      description: Diisi bila resep berasal dari kunjungan internal (source=internal)
    - name: patient_id
      type: relation
      relation: { type: belongs_to, resource: clinic.patient }
      description: Pasien terdaftar (opsional) — dipakai hook before/create untuk auto-fill patient_name
    - name: source
      type: enum
      enum_values: [internal, external]
      default: internal
      index: true
    - name: prescriber_name
      type: string
      description: Nama dokter penulis resep, untuk source=external (dokter luar, tidak ada di sistem)
    - name: patient_name
      type: string
      description: Denormalisasi untuk kartu kanban
      rules: [required]
    - name: priority
      type: enum
      enum_values: [normal, urgent]
      default: normal
      index: true
    - name: status
      type: enum
      enum_values: [queued, compounding, ready, dispensed, cancelled]
      index: true
    - name: items
      type: child
      child:
        storage: jsonb
        sequence_field: line_number
        fields:
          - { name: line_number, type: integer, immutable: true }
          - { name: medicine_id, type: uuid, rules: [required, exists: medicine] }
          - { name: quantity, type: integer, rules: [required, positive] }
          - { name: dosage_instructions, type: string, rules: [required] }
    - name: notes
      type: string

  state_machine:
    field: status
    initial: queued
    transitions:
      - { from: queued, to: compounding, via: start-compounding }
      - { from: compounding, to: ready, via: mark-ready }
      - { from: ready, to: dispensed, via: dispense }
      - { from: [queued, compounding], to: cancelled, via: cancel }

  actions:
    - name: create
      emits: created

    - name: delete
      disabled: true

    - name: start-compounding
      required_permission: prescriptions.compound
      audit: true
      impl: { type: script_ref, ref: start-compounding }

    - name: mark-ready
      required_permission: prescriptions.compound
      audit: true
      impl: { type: script_ref, ref: mark-ready }

    - name: dispense
      description: Serahkan obat — kurangi stok
      required_permission: prescriptions.dispense
      audit: true
      uses:
        resources: [medicine.find, medicine.update]
      impl: { type: script_ref, ref: dispense }

    - name: cancel
      required_permission: prescriptions.cancel
      audit: true
      impl: { type: script_ref, ref: cancel }

  events:
    - name: created
      type: async
      description: Resep baru masuk — antrian farmasi
      payload:
        fields: [id, number, source, patient_name, priority, status]
      deliver:
        - channel: audit_log
        - channel: websocket
          target: { scope: workspace }

  # SHOWCASE: hooks (Core Extended §8) — before/create runs synchronously
  # ahead of the insert. If patient_id is set, cross-module resource.fetch
  # (§0 fix) pulls the registered patient's name so patient_name doesn't
  # have to be retyped by hand.
  hooks:
    - on: before
      action: create
      impl: { type: script_ref, ref: derive-patient-name }
