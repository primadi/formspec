apiVersion: forma.dev/v1alpha1
kind: Table
metadata:
  name: part-request-list
  module: crc
  description: Tabel daftar Part Request
spec:
  entity: part-request
  default_sort: "-transaction_date"
  page_size: 20
  columns:
    - { field: number, label: "No. PR", sortable: true, width: "130px" }
    - { field: work_order.number, label: "WO", sortable: true }
    - { field: requested_by.name, label: "Pemohon" }
    - { field: status, label: "Status", sortable: true, width: "120px", align: "center" }
    - { field: approved_by.name, label: "Disetujui Oleh" }
    - { field: transaction_date, label: "Tanggal", sortable: true, width: "120px" }
  filters:
    - { field: status, label: "Status", type: select }
    - { field: work_order_id, label: "WO", type: select }
    - { field: transaction_date, label: "Tanggal", type: date_range }
  row_actions:
    - { action: "view", label: "Detail", icon: "eye" }
    - { action: "approve", label: "Setujui", icon: "thumbs-up" }
    - { action: "reject", label: "Tolak", icon: "x" }
    - { action: "fulfill", label: "Penuhi", icon: "package-check" }
  search: true
  realtime: true
