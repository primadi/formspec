# CRC: Part Request — permintaan sparepart dari serviceman ke warehouse.
# State machine: requested → approved/rejected → fulfilled
apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: part-request
  module: crc
  description: Permintaan sparepart dari serviceman/foreman ke warehouse
spec:
  version: v1
  characteristic: transaction

  auth: { required: true, strategies: [token] }

  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
    - name: number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      natural_key_rule:
        strategy: sequence
        format: "{prefix}-{year}-{seq:06d}"
        prefix: { config: crc.pr_prefix, default: "PR" }
        reset: yearly
      description: Nomor Part Request
    - name: work_order_id
      type: relation
      relation: { type: belongs_to, resource: work-order }
      required: true
      index: true
    - name: requested_by
      type: relation
      relation: { type: belongs_to, resource: employee }
      required: true
      description: Serviceman yang meminta
    - name: items
      type: child
      child:
        storage: jsonb
        sequence_field: line_number
        fields:
          - { name: line_number, type: integer, immutable: true }
          - { name: part_id, type: uuid, rules: [required] }
          - { name: part_code, type: string, rules: [required] }
          - { name: part_name, type: string }
          - { name: quantity, type: integer, rules: [required, positive] }
          - { name: notes, type: string }
    - name: status
      type: enum
      enum_values: [requested, approved, rejected, fulfilled]
      index: true
    - name: approved_by
      type: relation
      relation: { type: belongs_to, resource: employee }
      description: Foreman/Warehouseman yang menyetujui
    - name: approved_at
      type: datetime
    - name: fulfilled_by
      type: relation
      relation: { type: belongs_to, resource: employee }
      description: Warehouseman yang memenuhi
    - name: fulfilled_at
      type: datetime
    - name: rejection_reason
      type: string
      rules: [max_length: 500]
    - name: notes
      type: string
      rules: [max_length: 1000]

  state_machine:
    field: status
    initial: requested
    transitions:
      - { from: requested, to: approved, via: approve }
      - { from: requested, to: rejected, via: reject }
      - { from: approved, to: fulfilled, via: fulfill }

  actions:
    - name: update
      conditions:
        - script: "resource.status == 'requested'"
          message: "Part Request yang sudah diproses tidak bisa diedit"

    - name: delete
      disabled: true

    - name: approve
      description: Setujui permintaan sparepart
      required_permission: part-request.approve
      audit: true
      ui:
        confirm: "Setujui permintaan part ini?"
      impl: { type: script_ref, ref: crc/pr_approve }

    - name: reject
      description: Tolak permintaan sparepart
      required_permission: part-request.reject
      audit: true
      ui:
        confirm: "Tolak permintaan part ini?"
      impl: { type: script_ref, ref: crc/pr_reject }

    - name: fulfill
      description: Penuhi permintaan sparepart dari warehouse
      required_permission: part-request.fulfill
      audit: true
      ui:
        confirm: "Konfirmasi pengeluaran part dari warehouse?"
      impl: { type: script_ref, ref: crc/pr_fulfill }
