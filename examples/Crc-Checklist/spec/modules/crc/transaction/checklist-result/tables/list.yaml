apiVersion: forma.dev/v1alpha1
kind: Table
metadata:
  name: checklist-result-list
  module: crc
  description: Tabel daftar hasil checklist
spec:
  entity: checklist-result
  default_sort: "-inspection_date"
  page_size: 20
  columns:
    - { field: number, label: "No. CL", sortable: true, width: "130px" }
    - { field: work_order.number, label: "WO", sortable: true }
    - { field: template.name, label: "Template" }
    - { field: inspected_by.name, label: "Inspektur" }
    - { field: overall_result, label: "Hasil", width: "100px", align: "center" }
    - { field: inspection_date, label: "Tanggal Inspeksi", sortable: true, width: "140px" }
  filters:
    - { field: overall_result, label: "Hasil", type: select }
    - { field: template_id, label: "Template", type: select }
    - { field: inspection_date, label: "Tanggal", type: date_range }
  row_actions:
    - { action: "view", label: "Detail", icon: "eye" }
  search: true
