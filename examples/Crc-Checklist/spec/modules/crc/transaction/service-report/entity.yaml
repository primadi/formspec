# CRC: Service Report — laporan hasil servis lengkap dengan temuan & tindakan.
apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: service-report
  module: crc
  description: Laporan hasil servis — temuan, tindakan, rekomendasi
spec:
  version: v1
  characteristic: transaction

  auth: { required: true, strategies: [token] }

  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
    - name: number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      natural_key_rule:
        strategy: sequence
        format: "{prefix}-{year}-{seq:06d}"
        prefix: { config: crc.sr_prefix, default: "SR" }
        reset: yearly
      description: Nomor Service Report
    - name: work_order_id
      type: relation
      relation: { type: belongs_to, resource: work-order }
      required: true
      index: true
    - name: findings
      type: string
      rules: [required, max_length: 3000]
      description: Temuan saat servis
    - name: actions_taken
      type: string
      rules: [required, max_length: 3000]
      description: Tindakan yang dilakukan
    - name: parts_used
      type: string
      rules: [max_length: 2000]
      description: Sparepart yang digunakan
    - name: recommendations
      type: string
      rules: [max_length: 2000]
      description: Rekomendasi untuk customer
    - name: report_date
      type: date
      required: true
    - name: status
      type: enum
      enum_values: [draft, submitted]
      index: true
      default: draft

  actions:
    - name: update
      conditions:
        - script: "resource.status == 'draft'"
          message: "Service Report yang sudah disubmit tidak bisa diedit"

    - name: delete
      disabled: true

    - name: submit
      audit: true
      ui:
        confirm: "Submit laporan servis ini?"
      impl: { type: script_ref, ref: crc/sr_submit }
