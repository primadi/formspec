apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: work-order-edit
  module: crc
  description: Form edit Work Order
spec:
  entity: work-order
  mode: edit
  render: separate_page
  sections:
    - title: "Informasi Work Order"
      fields:
        - { field: transaction_date }
        - { field: equipment_id }
        - { field: customer_id }
        - { field: assigned_to }
        - { field: description }
    - title: "Detail Pekerjaan"
      fields:
        - { field: priority }
        - { field: scheduled_date }
        - { field: engine_hours_at_service }
        - { field: notes }
