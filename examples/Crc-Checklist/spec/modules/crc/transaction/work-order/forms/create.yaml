apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: work-order-create
  module: crc
  description: Form buat Work Order baru
spec:
  entity: work-order
  mode: create
  render: separate_page
  sections:
    - title: "Informasi Work Order"
      fields:
        - { field: transaction_date, rules: [required] }
        - { field: equipment_id, rules: [required] }
        - { field: customer_id, rules: [required] }
        - { field: assigned_to }
        - { field: description, rules: [required] }
    - title: "Detail Pekerjaan"
      fields:
        - { field: priority, rules: [required] }
        - { field: scheduled_date }
        - { field: engine_hours_at_service }
        - { field: notes }
