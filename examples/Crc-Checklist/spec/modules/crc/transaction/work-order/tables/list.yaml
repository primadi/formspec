apiVersion: forma.dev/v1alpha1
kind: Table
metadata:
  name: work-order-list
  module: crc
  description: Tabel daftar Work Order
spec:
  entity: work-order
  default_sort: "-transaction_date"
  page_size: 20
  columns:
    - { field: number, label: "No. WO", sortable: true, width: "140px" }
    - { field: equipment.name, label: "Equipment", sortable: true }
    - { field: customer.name, label: "Pelanggan", sortable: true }
    - { field: assigned_to.name, label: "Teknisi" }
    - { field: priority, label: "Prioritas", sortable: true, width: "100px", align: "center" }
    - { field: status, label: "Status", sortable: true, width: "120px", align: "center" }
    - { field: transaction_date, label: "Tanggal", sortable: true, width: "120px" }
  filters:
    - { field: status, label: "Status", type: select }
    - { field: priority, label: "Prioritas", type: select }
    - { field: customer_id, label: "Pelanggan", type: select }
    - { field: transaction_date, label: "Tanggal", type: date_range }
  row_actions:
    - { action: "view", label: "Detail", icon: "eye" }
    - { action: "start-work", label: "Mulai", icon: "play" }
    - { action: "complete", label: "Selesai", icon: "check" }
    - { action: "approve", label: "Setujui", icon: "thumbs-up" }
    - { action: "cancel", label: "Batalkan", icon: "x" }
  search: true
  realtime: true
