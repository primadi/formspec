# CRC: Work Order — dokumen transaksi utama servis alat berat.
# State machine: Open → InProgress → Completed → Approved
# Cancel tersedia dari Open.
apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: work-order
  module: crc
  description: Work Order — permintaan servis alat berat dari pelanggan
spec:
  version: v1
  characteristic: transaction

  auth: { required: true, strategies: [token] }

  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
    - name: number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      natural_key_rule:
        strategy: sequence
        format: "{prefix}-{year}-{seq:06d}"
        prefix: { config: crc.wo_prefix, default: "WO" }
        reset: yearly
      description: Nomor Work Order
    - name: equipment_id
      type: relation
      relation: { type: belongs_to, resource: equipment }
      required: true
    - name: customer_id
      type: relation
      relation: { type: belongs_to, resource: customer }
      required: true
    - name: assigned_to
      type: relation
      relation: { type: belongs_to, resource: employee }
      description: Serviceman yang ditugaskan
    - name: description
      type: string
      rules: [required, max_length: 2000]
      description: Deskripsi masalah/pekerjaan
    - name: priority
      type: enum
      enum_values: [low, medium, high, critical]
      required: true
      default: medium
      index: true
    - name: status
      type: enum
      enum_values: [open, in_progress, completed, approved, cancelled]
      index: true
    - name: scheduled_date
      type: date
      description: Tanggal dijadwalkan
    - name: completed_date
      type: date
      description: Tanggal selesai
    - name: engine_hours_at_service
      type: integer
      rules: [positive]
      description: HM alat saat diservis
    - name: notes
      type: string
      rules: [max_length: 2000]

  state_machine:
    field: status
    initial: open
    transitions:
      - { from: open, to: in_progress, via: start-work,
          guard: { expression: "resource.assigned_to != null", message: "Work Order harus di-assign ke teknisi sebelum dikerjakan" } }
      - { from: in_progress, to: completed, via: complete }
      - { from: completed, to: approved, via: approve }
      - { from: [open, in_progress], to: cancelled, via: cancel }

  actions:
    - name: update
      conditions:
        - script: "resource.status in ['open', 'in_progress']"
          message: "Work Order yang sudah completed/approved/cancelled tidak bisa diedit"

    - name: delete
      disabled: true

    - name: start-work
      description: Mulai pengerjaan servis
      required_permission: work-order.start-work
      audit: true
      ui:
        confirm: "Mulai pengerjaan Work Order ini?"
      impl: { type: script_ref, ref: crc/wo_start_work }

    - name: complete
      description: Servis selesai — menunggu approval Foreman
      required_permission: work-order.complete
      audit: true
      emits: completed
      ui:
        confirm: "Tandai Work Order ini selesai?"
      impl: { type: script_ref, ref: crc/wo_complete }

    - name: approve
      description: Foreman menyetujui hasil servis
      required_permission: work-order.approve
      audit: true
      emits: approved
      ui:
        confirm: "Setujui Work Order ini?"
      impl: { type: script_ref, ref: crc/wo_approve }

    - name: cancel
      description: Batalkan Work Order
      required_permission: work-order.cancel
      audit: true
      ui:
        confirm: "Batalkan Work Order ini?"
      impl: { type: script_ref, ref: crc/wo_cancel }

  events:
    - name: completed
      type: async
      description: Work Order selesai dikerjakan — siap di-review Foreman
      deliver:
        - channel: audit_log
    - name: approved
      type: async
      description: Work Order disetujui Foreman
      deliver:
        - channel: audit_log
