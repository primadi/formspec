apiVersion: forma.dev/v1alpha1
kind: Table
metadata:
  name: employee-list
  module: crc
  description: Tabel daftar karyawan
spec:
  entity: employee
  default_sort: "name"
  page_size: 20
  columns:
    - { field: employee_number, label: "NIK", sortable: true, width: "130px" }
    - { field: name, label: "Nama", sortable: true }
    - { field: role, label: "Role", sortable: true, width: "150px", align: "center" }
    - { field: phone, label: "Telepon", width: "150px" }
    - { field: email, label: "Email" }
    - { field: is_active, label: "Aktif", width: "80px", align: "center" }
  filters:
    - { field: role, label: "Role", type: select }
    - { field: is_active, label: "Status", type: select }
    - { field: name, label: "Cari Nama", type: text }
  row_actions:
    - { action: "view", label: "Detail", icon: "eye" }
  search: true
