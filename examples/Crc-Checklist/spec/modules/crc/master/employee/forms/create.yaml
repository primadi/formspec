apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: employee-create
  module: crc
  description: Form tambah karyawan
spec:
  entity: employee
  mode: create
  render: drawer
  sections:
    - title: "Data Karyawan"
      fields:
        - { field: employee_number }
        - { field: name }
        - { field: role }
        - { field: phone }
        - { field: email }
        - { field: joined_at }
        - { field: is_active }
        - { field: notes }
