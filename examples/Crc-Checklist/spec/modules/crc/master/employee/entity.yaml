apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: employee
  module: crc
  description: Karyawan — serviceman, foreman, warehouseman, super admin
spec:
  version: v1
  characteristic: master

  auth: { required: true, strategies: [token] }

  display_field: name

  fields:
    - name: employee_number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      rules: [required, min_length: 3, max_length: 30]
      natural_key_rule:
        strategy: sequence
        format: "EMP-{seq:05d}"
        reset: never
      description: Nomor induk karyawan
    - name: name
      type: string
      index: true
      rules: [required, min_length: 2, max_length: 200]
    - name: role
      type: enum
      enum_values: [super_admin, serviceman, foreman, warehouseman]
      required: true
      index: true
    - name: phone
      type: string
      rules: [pattern: "^\\+?[0-9]{7,15}$"]
    - name: email
      type: string
      rules: [email]
    - name: is_active
      type: boolean
      default: true
      index: true
    - name: joined_at
      type: date
      rules: [past]
    - name: notes
      type: string

  actions:
    - name: submit
      disabled: true
