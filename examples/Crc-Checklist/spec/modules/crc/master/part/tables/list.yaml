apiVersion: forma.dev/v1alpha1
kind: Table
metadata:
  name: part-list
  module: crc
  description: Tabel daftar sparepart
spec:
  entity: part
  default_sort: "name"
  page_size: 20
  columns:
    - { field: code, label: "Kode", sortable: true, width: "120px" }
    - { field: name, label: "Nama Part", sortable: true }
    - { field: unit, label: "Satuan", width: "80px" }
    - { field: stock_quantity, label: "Stok", sortable: true, width: "80px", align: "right" }
    - { field: min_stock, label: "Min. Stok", width: "80px", align: "right" }
    - { field: price, label: "Harga", sortable: true, width: "120px", align: "right" }
    - { field: is_active, label: "Aktif", width: "80px", align: "center" }
  filters:
    - { field: unit, label: "Satuan", type: select }
    - { field: is_active, label: "Status", type: select }
    - { field: name, label: "Cari Nama", type: text }
  row_actions:
    - { action: "view", label: "Detail", icon: "eye" }
  search: true
