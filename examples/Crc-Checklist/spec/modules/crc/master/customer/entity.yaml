apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: customer
  module: crc
  description: Perusahaan pemilik alat berat — pelanggan Trakindo
spec:
  version: v1
  characteristic: master

  auth: { required: true, strategies: [token] }

  display_field: name

  fields:
    - name: code
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      rules: [required, min_length: 2, max_length: 20]
      natural_key_rule:
        strategy: sequence
        format: "CUST-{seq:05d}"
        reset: never
      description: Kode pelanggan unik
    - name: name
      type: string
      index: true
      rules: [required, min_length: 2, max_length: 200]
      description: Nama perusahaan
    - name: address
      type: string
      rules: [max_length: 500]
    - name: phone
      type: string
      rules: [pattern: "^\\+?[0-9]{7,15}$"]
    - name: email
      type: string
      rules: [email]
    - name: npwp
      type: string
      description: NPWP perusahaan
      rules: [pattern: "^[0-9]{15,16}$"]
    - name: contact_person
      type: string
      rules: [max_length: 120]
    - name: is_active
      type: boolean
      default: true
      index: true
    - name: notes
      type: string

  actions:
    - name: submit
      disabled: true
