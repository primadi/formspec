apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: equipment-edit
  module: crc
  description: Form edit equipment
spec:
  entity: equipment
  mode: edit
  render: drawer
  sections:
    - title: "Identitas Unit"
      fields:
        - { field: name }
        - { field: customer_id }
        - { field: brand }
        - { field: model }
    - title: "Detail Unit"
      fields:
        - { field: year }
        - { field: engine_hours }
        - { field: last_service_date }
        - { field: is_active }
        - { field: notes }
