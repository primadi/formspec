apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: equipment-create
  module: crc
  description: Form tambah equipment baru
spec:
  entity: equipment
  mode: create
  render: drawer
  sections:
    - title: "Identitas Unit"
      fields:
        - { field: serial_number }
        - { field: name }
        - { field: customer_id }
        - { field: brand }
        - { field: model }
    - title: "Detail Unit"
      fields:
        - { field: year }
        - { field: engine_hours }
        - { field: last_service_date }
        - { field: is_active }
        - { field: notes }
