apiVersion: forma.dev/v1alpha1
kind: Table
metadata:
  name: equipment-list
  module: crc
  description: Tabel daftar equipment alat berat
spec:
  entity: equipment
  default_sort: "name"
  page_size: 20
  columns:
    - { field: serial_number, label: "Serial Number", sortable: true, width: "150px" }
    - { field: name, label: "Nama/Model", sortable: true }
    - { field: customer.name, label: "Pelanggan", sortable: true }
    - { field: brand, label: "Merek", width: "120px" }
    - { field: year, label: "Tahun", width: "80px", align: "center" }
    - { field: engine_hours, label: "HM", width: "80px", align: "right" }
    - { field: is_active, label: "Aktif", width: "80px", align: "center" }
  filters:
    - { field: brand, label: "Merek", type: select }
    - { field: customer_id, label: "Pelanggan", type: select }
    - { field: is_active, label: "Status", type: select }
    - { field: name, label: "Cari", type: text }
  row_actions:
    - { action: "view", label: "Detail", icon: "eye" }
  search: true
