apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: equipment
  module: crc
  description: Alat berat milik pelanggan — excavator, bulldozer, dll.
spec:
  version: v1
  characteristic: master

  auth: { required: true, strategies: [token] }

  display_field: name

  fields:
    - name: serial_number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      rules: [required, min_length: 3, max_length: 50]
      description: Nomor seri unit alat berat
    - name: name
      type: string
      rules: [required, max_length: 200]
      description: Nama/model alat berat
    - name: customer_id
      type: relation
      relation: { type: belongs_to, resource: customer }
      required: true
      index: true
    - name: brand
      type: string
      rules: [required, max_length: 100]
      description: Merek (Caterpillar, Komatsu, dll)
    - name: model
      type: string
      rules: [required, max_length: 100]
    - name: year
      type: integer
      rules: [required, positive, min: 1990, max: 2030]
    - name: engine_hours
      type: integer
      default: 0
      rules: [positive]
      description: Total jam engine (HM)
    - name: last_service_date
      type: date
      description: Tanggal servis terakhir
    - name: is_active
      type: boolean
      default: true
      index: true
    - name: notes
      type: string

  actions:
    - name: submit
      disabled: true
