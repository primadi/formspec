apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: checklist-template
  module: crc
  description: Template checklist inspeksi — daftar item yang harus diperiksa
spec:
  version: v1
  characteristic: master

  auth: { required: true, strategies: [token] }

  display_field: name

  fields:
    - name: code
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      rules: [required, min_length: 2, max_length: 30]
      description: Kode template
    - name: name
      type: string
      rules: [required, max_length: 200]
    - name: category
      type: enum
      enum_values: [harian, mingguan, bulanan, pre-service, post-service, general]
      required: true
      default: general
      index: true
    - name: items
      type: child
      child:
        storage: jsonb
        sequence_field: order_index
        fields:
          - { name: order_index, type: integer, immutable: true }
          - { name: item_name, type: string, rules: [required, max_length: 300] }
          - { name: is_required, type: boolean, default: true }
          - { name: item_type, type: enum, enum_values: [pass_fail, text, numeric, photo], default: pass_fail }
    - name: is_active
      type: boolean
      default: true
      index: true
    - name: notes
      type: string

  actions:
    - name: submit
      disabled: true
