apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: checklist-template-create
  module: crc
  description: Form buat template checklist baru
spec:
  entity: checklist-template
  mode: create
  render: drawer
  sections:
    - title: "Informasi Template"
      fields:
        - { field: code, rules: [required] }
        - { field: name, rules: [required] }
        - { field: category, rules: [required] }
        - { field: is_active }
        - { field: notes }
    - title: "Item Checklist"
      fields:
        - { field: items }
