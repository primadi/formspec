apiVersion: forma.dev/v1alpha1
kind: Form
metadata:
  name: checklist-template-edit
  module: crc
  description: Form edit template checklist
spec:
  entity: checklist-template
  mode: edit
  render: drawer
  sections:
    - title: "Informasi Template"
      fields:
        - { field: name }
        - { field: category }
        - { field: is_active }
        - { field: notes }
    - title: "Item Checklist"
      fields:
        - { field: items }
