apiVersion: formspec.dev/v1
kind: Module
metadata:
  name: billing
  description: Modul billing — midtrans payment gateway wrapper
spec:
  version: 1.0.0
  depends:
    - module: formspec/core
  # Default menu suggestion (Core Basic §4.5) — migrated from the old
  # standalone kind: Menu (spec/menus/billing-payment-menu.yaml). Adopted by
  # a host App via a `type: module` entry in its own spec.menu.
  menu:
    - label: "Pembayaran"
      icon: "credit-card"
      children:
        - { label: "Konfigurasi Midtrans", icon: "settings", view: midtrans-config }
        - { label: "Log Webhook", icon: "webhook", view: midtrans-webhook-log }
        - label: "Simulasi"
          icon: "flask"
          route: "/settings/payment/midtrans/simulation" # no authored View for this yet
