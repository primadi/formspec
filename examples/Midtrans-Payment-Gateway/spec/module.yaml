apiVersion: forma.dev/v1alpha1
kind: Module
metadata:
  name: billing
  description: Modul billing — midtrans payment gateway wrapper
spec:
  version: 1.0.0
  depends:
    - module: forma/core
  # Default menu suggestion (Core Basic §4.5) — migrated from the old
  # standalone kind: Menu (spec/menus/billing-payment-menu.yaml). Adopted by
  # a host App via a `type: module` entry in its own spec.menu.
  menu:
    - label: "Pembayaran"
      icon: "credit-card"
      order: 20
      children:
        - { label: "Konfigurasi Midtrans", icon: "settings", view: midtrans-config, order: 1 }
        - { label: "Log Webhook", icon: "webhook", view: midtrans-webhook-log, order: 2 }
        - label: "Simulasi"
          icon: "flask"
          route: "/settings/payment/midtrans/simulation" # no authored View for this yet
          order: 3
