# Payment menu — sidebar entries for payment gateway settings
apiVersion: forma.dev/v1alpha1
kind: Menu
metadata:
  name: billing-payment-menu
  module: billing
  description: Menu konfigurasi payment gateway
spec:
  label: "Pembayaran"
  icon: "credit-card"
  order: 20
  children:
    - label: "Konfigurasi Midtrans"
      icon: "settings"
      route: "/settings/payment/midtrans"
      order: 1
    - label: "Log Webhook"
      icon: "webhook"
      route: "/settings/payment/midtrans/webhooks"
      order: 2
    - label: "Simulasi"
      icon: "flask"
      route: "/settings/payment/midtrans/simulation"
      order: 3
