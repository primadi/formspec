apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: journal-entry
  module: gl
  description: Satu journal entry — selalu double-entry (min 2 baris)
spec:
  version: v1
  characteristic: transaction

  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
    - name: source
      type: string
      immutable: true
      index: true
      description: Resource asal — "billing.order"
    - name: source_id
      type: uuid
      immutable: true
      index: true
    - name: amount
      type: decimal
      rules: [required]
    - name: entry_date
      type: date
      rules: [required]
    - name: number
      type: string
      natural_key: true
      immutable: true
      unique: true
      index: true
      natural_key_rule:
        strategy: sequence
        format: "JRN-{year}-{seq:06d}"
        prefix: { value: "JRN" }
        reset: yearly
    - name: description
      type: string
      rules: [required]
    - name: status
      type: enum
      enum_values: [draft, posted, reversed]
      index: true
    - name: lines
      type: child
      child:
        storage: table
        sequence_field: line_number
        fields:
          - { name: line_number, type: integer, immutable: true }
          - { name: account_id, type: uuid, rules: [required, {exists: account}] }
          - { name: description, type: string }
          - { name: debit, type: decimal, rules: [min: 0] }
          - { name: credit, type: decimal, rules: [min: 0] }

  state_machine:
    field: status
    initial: draft
    transitions:
      - { from: draft, to: posted, via: post,
          guard: "sum_line('debit') == sum_line('credit') and sum_line('debit') > 0" }
      - { from: posted, to: reversed, via: reverse }

  actions:
    - name: create
      required_permission: journal-entries.create
      idempotent: true
      audit: true

    - name: post
      description: Posting journal entry — update GL balance
      required_permission: journal-entries.post
      idempotent: true
      idempotency_key: { from: server }
      audit: true
      emits: journal-posted
      uses:
        primitives: [lock]
      impl: { type: script_ref, ref: gl/journal_post }
