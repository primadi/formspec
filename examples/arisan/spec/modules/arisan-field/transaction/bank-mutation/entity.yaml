apiVersion: forma.dev/v1alpha1
kind: Entity
metadata:
  name: bank-mutation
  module: arisan-field
  description: "Mutasi bank — rekaman pergerakan dana rekening grup untuk dicocokkan dengan iuran"
spec:
  version: v1
  characteristic: transaction
  lifecycle: plain_crud
  plural: bank-mutations
  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
      title: "Tanggal Transaksi"
    - name: group_id
      type: relation
      relation: { type: belongs_to, resource: arisan-master.arisan-group }
      required: true
      title: "Grup"
      description: "Rekening grup yang menerima dana"
    - name: amount
      type: money
      required: true
      title: "Nominal"
      description: "Nominal kredit (dana masuk) yang dicocokkan dengan iuran"
    - name: description
      type: string
      title: "Keterangan"
      description: "Keterangan transfer dari bank — dicocokkan dengan payment_ref anggota"
    - name: balance
      type: money
      title: "Saldo"
    - name: direction
      type: enum
      enum_values: [debit, kredit]
      default: kredit
      title: "Arah"
    - name: bank_ref
      type: string
      title: "Ref Bank"
    - name: channel
      type: string
      title: "Channel"
    - name: counter
      type: integer
      title: "Urutan"
    - name: import_batch
      type: string
      title: "Batch Import"
    - name: raw_line
      type: text
      title: "Baris Mentah"
    - name: status
      type: enum
      enum_values: [unmatched, matched, ignored]
      default: unmatched
      index: true
      title: "Status"
    - name: matched_contribution_id
      type: relation
      relation: { type: belongs_to, resource: arisan-field.contribution }
      title: "Iuran Tercocok"
  actions:
    - name: submit
      disabled: true
  indexes:
    - fields: [group_id, amount, transaction_date]
  expose:
    - type: rest
      actions: [list, find, create, update, delete]
