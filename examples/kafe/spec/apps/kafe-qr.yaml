apiVersion: formspec.dev/v1
kind: App
metadata:
  name: kafe-qr
  description: "Permukaan publik kafe — menu & pemesanan mandiri pelanggan dari QR meja"
spec:
  root_url: /
  access: public
  app_renderer: no-nav
  # `no-nav` = tanpa bar DEFAULT, bukan tanpa chrome. Region tetap ada dan
  # boleh diisi (frontend/05-app-kinds.md §4.2): di sini topbar = brand bar
  # minimal dan footer menyala, tanpa nav dan tanpa kontrol auth (pelanggan
  # tidak login). Sesi staf yang kebetulan mendarat di sini kini tetap punya
  # jalan keluar lewat user menu — kontrol sesi dirender bila ada token,
  # terlepas dari `chrome.auth`.
  chrome:
    regions:
      topbar: auto
      sidebar: none
      rightbar: none
      bottombar: none
      footer: auto
  # Anonim hanya boleh menyentuh entity & aksi yang didaftarkan di bawah.
  # Sebelum `public_entities` ada, `access: public` memberi anonim
  # `list`/`find`/`create` untuk SELURUH entity di module yang di-mount —
  # sehingga memount `cafe-order` ikut membuka `shift` dan `cash-movement`
  # (data kas & shift), dan `cafe-master` ikut membuka `member` (nomor HP
  # pelanggan) dan `employee`. Itu tertutup oleh daftar ini (GAP-06).
  #
  # Pelanggan memesan lewat QR: hanya perlu MELIHAT katalog + MEMBUAT pesanan.
  # Update/delete tidak pernah anonim — pembatalan lewat approval supervisor
  # (kind: Workflow), bukan tombol pelanggan.
  public_entities:
    - { entity: cafe-master.menu-category, actions: [list, find] }
    - { entity: cafe-master.menu-item, actions: [list, find] }
    # Harga per cabang: daftar anonim hanya boleh dibaca BERSAMA cabang yang
    # diminta (`?branch_id=…`, diisi picker dari sesi meja). Sebelumnya daftar
    # ini terbuka tanpa syarat, sehingga satu permintaan tanpa parameter
    # mengembalikan harga SELURUH cabang (item 3.5).
    - entity: cafe-master.menu-item-price
      actions: [list]
      scope:
        - { field: branch_id, op: eq, from: route }
    # Meja di-resolve dari token QR (find saja — pelanggan tidak perlu list meja).
    - { entity: cafe-master.dining-table, actions: [find] }
    # Satu kunjungan per meja; token sesi menjadi kunci akses pelanggan.
    - { entity: cafe-order.table-session, actions: [create, find] }
    # Pesanan dibuat anonim; penyelesaiannya (bayar, submit) dilakukan kasir
    # di kafe-pos.
    #
    # `list` untuk anonim hanya diberikan BERSAMA scope (#45): tanpa scope itu,
    # "anonim boleh list" berarti seluruh pesanan kafe — termasuk meja dan tamu
    # lain — dan itulah yang membuat grant ini berbahaya sebelum 2.2. Dengan
    # scope, pelanggan hanya menerima baris yang token tamunya cocok dengan
    # token di URL, dan permintaan tanpa token **ditolak** (bukan berarti
    # "tanpa filter"). Nilainya dibaca engine dari query, jadi klien tidak bisa
    # melebarkannya.
    #
    # `create` tetap terbuka (pelanggan anonim memesan); `find` sengaja TIDAK
    # diberikan: ia men-resolve lewat id dan scope tidak bisa menjaganya
    # (validator menolak kombinasi itu).
    #
    # Catatan: grant ini TIDAK melebarkan akses kasir. Route `/_ui/entity`
    # dipakai bersama oleh kafe-pos; permintaan yang sudah terautentikasi tetap
    # wajib punya `cafe-order.orders.list`, dan scope anonim tidak berlaku
    # untuknya (kalau berlaku, table POS yang tidak membawa token akan 403).
    - entity: cafe-order.order
      actions: [create, list]
      scope:
        - { field: guest_token, op: eq, from: route }
  modules:
    - cafe-master
    - cafe-order
  # Permukaan App publik = target menu ∪ `registered_views`. kafe-qr sengaja
  # TIDAK punya menu (no-nav), jadi satu-satunya deklarasi permukaannya ada di
  # sini: tiga Page yang dilalui pelanggan dari scan QR sampai lihat status.
  # Tanpa daftar ini tidak ada satu pun route yang dibuat (semuanya 404) —
  # entity di `public_entities` TETAP dapat diakses lewat API (katalog/pesanan),
  # tetapi tidak punya route yang bisa dibuka langsung di SPA.
  #
  #   /t/:qr_token       table-open       → buka/gabung sesi meja dari token QR
  #   /menu/:session_id  menu-catalog     → katalog + keranjang + kirim pesanan
  #   /status/:guest_token order-status-page → status pesanan setelah submit
  registered_views:
    - { view: cafe-order/table-open }
    - { view: cafe-order/menu-catalog }
    - { view: cafe-order/order-status-page }
  # menu dikosongkan: `no-nav` default tidak merender nav sama sekali.
  # Halaman pelanggan sudah ada: `cafe-order/pages/menu-catalog.yaml`
  # (katalog + keranjang + kirim pesanan). UX itu datang dari `picker` pada child
  # field `order.lines` + `order-form-qr` — bukan dari kind/blok khusus (S1).
  # Ia mengambil ID sesi dari route; langkah token QR → sesi masih item
  # terpisah (TODO 2.2).
  confirm:
    create: "Kirim pesanan?"
    update: "Simpan perubahan pesanan?"
    delete: "Batalkan pesanan?"
