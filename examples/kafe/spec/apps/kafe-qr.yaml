apiVersion: formspec.dev/v1
kind: App
metadata:
  name: kafe-qr
  description: "Permukaan publik kafe — menu & pemesanan mandiri pelanggan dari QR meja"
spec:
  root_url: /
  access: public
  app_renderer: no-nav
  # `no-nav` = tanpa bar DEFAULT, bukan tanpa chrome. Region tetap ada dan
  # boleh diisi (frontend/05-app-kinds.md §4.2): di sini topbar = brand bar
  # minimal dan footer menyala, tanpa nav dan tanpa kontrol auth (pelanggan
  # tidak login). Sesi staf yang kebetulan mendarat di sini kini tetap punya
  # jalan keluar lewat user menu — kontrol sesi dirender bila ada token,
  # terlepas dari `chrome.auth`.
  chrome:
    regions:
      topbar: auto
      sidebar: none
      rightbar: none
      bottombar: none
      footer: auto
  # Akses anonim TIDAK dideklarasikan di sini. Ia diturunkan dari permukaan App
  # (`registered_views` di bawah + `public` pada tiap view): apa pun yang
  # dibaca/ditulis view publik itulah yang dibuka untuk anonim.
  #
  # Kenapa diturunkan, bukan didaftarkan manual: halaman pelanggan sudah
  # menyatakan niatnya sendiri — Page ber-`public: true`, field child dengan
  # `picker` yang menyebut entity sumber, Table dengan `param` route yang
  # menjadi scope baris. Daftar manual kedua kalinya hanya bisa DRIFT dari
  # kenyataan itu (item yang ditulis tapi tak dipakai klien, atau sebaliknya
  # view baru yang lupa didaftarkan → 401 pada jalur yang seharusnya jalan).
  #
  # Hasil turunan untuk App ini (terukur, lihat TestDerivePublicGrants_KafeQR):
  #   cafe-order.order            create, list  (+ scope guest_token dari route)
  #   cafe-order.table-session    create, find
  #   cafe-master.dining-table    find         (dari context: {source: entity})
  #   cafe-master.menu-item       list         (dari picker child field `lines`)
  #   cafe-master.menu-item-price list         (dari picker.display.price_entity)
  #
  # Perhatikan yang TIDAK ikut — inilah presisinya:
  #   * `menu-category` tidak di-grant: chip kategori dibaca dari baris yang
  #     sudah dimuat (`picker.display.category_field`), jadi tak ada request.
  #   * `menu-item` hanya `list`, bukan `find`: picker tidak pernah fetch satu
  #     item lewat id.
  #   * `order.find` tidak diberikan: grant `order` ber-scope, dan `find`
  #     resolve lewat id sehingga scope tak bisa menjaganya.
  #   * `member`, `employee`, `shift`, `cash-movement` tidak pernah ikut hanya
  #     karena se-modul.
  #
  # ⚠️ SATU DELTA YANG DISENGAJA TERBUKA (kafe 10.69 ⏸️): `menu-item-price`
  # sebelumnya ber-scope `{field: branch_id, from: route}`; turunan TIDAK bisa
  # mereproduksinya, jadi grant-nya kini `list` tanpa scope. Sebabnya:
  # price_filter picker bernilai `{session.branch_id}` — cabang datang dari
  # record sesi (di-resolve lewat `session_id`), bukan dari parameter route pada
  # entity harga, dan `from: session` memang ditolak untuk permukaan publik.
  # Artinya anonim kini bisa membaca harga SEMUA cabang, bukan hanya cabangnya.
  # Tidak ada PII di sana, tetapi ini pelemahan nyata dibanding manifest lama —
  # dicatat sebagai item, bukan disembunyikan.
  #
  # Update/delete tidak pernah anonim: pembatalan lewat approval supervisor
  # (pada transisi `void-order`), bukan tombol pelanggan.
  modules:
    - cafe-master
    - cafe-order
  # Permukaan App publik = target menu ∪ `registered_views`. kafe-qr sengaja
  # TIDAK punya menu (no-nav), jadi satu-satunya deklarasi permukaannya ada di
  # sini: tiga Page yang dilalui pelanggan dari scan QR sampai lihat status.
  # Tanpa daftar ini tidak ada satu pun route yang dibuat (semuanya 404) —
  # grant anonim pun diturunkan dari daftar ini, jadi tanpa entri di sini
  # katalog/pesanan juga tidak terbuka lewat API (bukan hanya 404 di SPA).
  #
  #   /t/:qr_token       table-open       → buka/gabung sesi meja dari token QR
  #   /menu/:session_id  menu-catalog     → katalog + keranjang + kirim pesanan
  #   /status/:guest_token order-status-page → status pesanan setelah submit
  registered_views:
    - { view: cafe-order/table-open }
    - { view: cafe-order/menu-catalog }
    - { view: cafe-order/order-status-page }
  # menu dikosongkan: `no-nav` default tidak merender nav sama sekali.
  # Halaman pelanggan sudah ada: `cafe-order/pages/menu-catalog.yaml`
  # (katalog + keranjang + kirim pesanan). UX itu datang dari `picker` pada child
  # field `order.lines` + `order-form-qr` — bukan dari kind/blok khusus (S1).
  # Ia mengambil ID sesi dari route; langkah token QR → sesi masih item
  # terpisah (TODO 2.2).
  confirm:
    create: "Kirim pesanan?"
    update: "Simpan perubahan pesanan?"
    delete: "Batalkan pesanan?"
