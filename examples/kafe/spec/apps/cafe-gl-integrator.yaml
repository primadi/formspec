apiVersion: formspec.dev/v1
kind: App
metadata:
  name: cafe-gl-integrator
  description: "Integrator: penjualan kafe menjadi jurnal akuntansi (vertical gl)"
spec:
  root_url: /app/cafe-gl-integrator
  access: private
  app_renderer: no-nav
  modules:
    - cafe-gl-integrator
  # ── ⚠️ GAP-15 — DEKLARASI INI BERJALAN DI ATAS JALAN YANG BELUM TERSAMBUNG ──
  #
  # `consumes` memicu permintaan GRANT ke App pemilik antarmuka
  # (02-workspace-app-module.md §3). Tapi menurut catatan gap resmi FormSpec:
  #   - "Cross-app grant enforcement unimplemented — zero runtime implementation"
  #   - "SyncAgent registry sync not wired to the live HTTP router" → "a real
  #     multi-App workspace can accept manifests per App but can't yet serve
  #     them together end-to-end"
  #
  # Artinya: manifest ini VALID dan menyatakan integrasi yang benar, tetapi
  # komposisi lintas-App (kafe + gl dalam satu workspace) belum bisa dilayani
  # end-to-end. Ini justru inti test case-nya: spec ideal yang menuntut engine
  # menyusul.
  #
  # Pilihan sementara bila ingin jalan hari ini (lebih buruk, tapi berjalan):
  # tanam `kind: Subscription` di dalam module `cafe-order` (satu App saja).
  # Konsekuensinya: logika akuntansi menempel di pemiliknya, tidak bisa diganti
  # vendor, dan tidak ada batas konsen di antara keduanya.
  consumes:
    - app: gl
      service: journal-entries
  # Tanpa menu: App ini tidak punya permukaan UI — ia hanya menyambungkan.
  # `no-nav` + modul tanpa entity UI = tidak ada halaman yang bisa dibuka.
