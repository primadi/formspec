apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: dining-table
  module: cafe-master
  description: "Meja + token QR untuk pemesanan mandiri pelanggan"
spec:
  version: v1
  characteristic: master
  plural: dining-tables
  display_field: code
  soft_deactivate: { enabled: true }
  # S5: meja milik satu cabang — dimensi ini punya sumbernya di
  # `cafe-master.employee.assignments` (username → branch_id).
  scope: { dimension: branch, field: branch_id, required: true }
  fields:
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: code
      type: string
      required: true
      title: "Kode Meja"
      description: "Mis. A-01"
    - name: area
      type: enum
      enum_values: [indoor, outdoor, smoking, vip]
      default: indoor
      title: "Area"
    - name: seats
      type: integer
      default: 2
      title: "Kapasitas"
    # Token acak — dasar URL QR meja (aturan bisnis #2).
    # GAP-03 (separuh): generator QR **sudah ada** sejak 2.6 — `kind: Print`
    # punya body item `qrcode` (html/pdf/thermal), dan token ini sudah dipakai
    # struk digital/thermal lewat `/kafe/status/{guest_token}`.
    #
    # Yang belum bisa dinyatakan: **kartu meja** yang QR-nya langsung membuka
    # sesi tamu. Pindai QR meja harus men-resolve meja dari token ini lalu
    # membuat `table-session` dan mengarahkan ke halaman menu — halaman masuk
    # semacam itu belum bisa dinyatakan (resolve entity dari token route +
    # create-lalu-redirect). Tercatat sebagai task deferred di ledger, bukan
    # dipaksakan dengan QR yang tidak menuju ke mana pun.
    #
    # Yang masih berlaku: token diisi script/Service (tidak ada
    # `natural_key_rule` untuk nilai acak).
    - name: qr_token
      type: string
      required: true
      unique: true
      title: "Token QR"
  indexes:
    - fields: [branch_id, code]
      unique: true
  # expose: [] — UI-only.
