apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: promo
  module: cafe-master
  description: "ATURAN promo (bukan pemakaian) — disimpan dan dievaluasi saat pemesanan"
spec:
  version: v1
  characteristic: master
  plural: promos
  display_field: name
  soft_deactivate: { enabled: true }
  # S5: promo boleh berlaku di semua cabang (branch_id kosong = global), jadi
  # dimensinya tidak `required`.
  scope: { dimension: branch, field: branch_id }
  fields:
    - name: code
      type: string
      required: true
      natural_key: true
      title: "Kode Promo"
      description: "Mis. HAPPY-HOUR-20"
    - name: name
      type: string
      required: true
      title: "Nama Promo"
    - name: type
      type: enum
      enum_values: [percentage, fixed, buy_x_get_y]
      required: true
      title: "Jenis Promo"
    - name: percent
      type: percent
      scale: 2
      title: "Persentase (%)"
    # Memakai `moneyinput`. GAP-02 (indeks money) masih terbuka.
    - name: value
      type: money
      title: "Nominal Potongan"
    - name: buy_qty
      type: integer
      title: "Beli (qty)"
    - name: get_qty
      type: integer
      title: "Gratis (qty)"
    - name: applies_to
      type: enum
      enum_values: [order, menu_item, category]
      default: order
      title: "Berlaku Untuk"
    - name: menu_item_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.menu-item }
      title: "Menu Spesifik"
    - name: menu_category_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.menu-category }
      title: "Kategori Spesifik"
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      title: "Cabang"
      description: "Kosong = berlaku di semua cabang"
    - name: min_purchase
      type: money
      title: "Minimum Belanja"
    - name: start_date
      type: date
      title: "Mulai Berlaku"
    - name: end_date
      type: date
      title: "Selesai Berlaku"
    - name: days_of_week
      type: json
      # Cardinality ada di Entity, bukan di form: satu promo memakai BEBERAPA
      # hari, jadi field ini sebuah himpunan. Form cukup mengikuti deklarasi ini
      # (dulu `widget: select-multi-tag` harus ditulis di `promo-form.yaml`,
      # sehingga keputusan single/multi hidup di Form — sekarang tidak lagi).
      multiple: true
      title: "Hari Berlaku"
      description: "Array angka 1=Senin..7=Minggu, mis. [1,2,3,4,5]"
      # Himpunan tertutup + caption: `enum_values` hanya membawa nilai, jadi
      # [1,2,3] tampil sebagai "1, 2, 3" dan 1 tidak pernah terbaca sebagai
      # Senin. `options` membuat widget `select-multi-tag` menawarkan hari
      # sebagai pilihan, bukan ketikan bebas (yang dulu bisa menyimpan 9).
      options:
        - { value: 1, label: "Senin" }
        - { value: 2, label: "Selasa" }
        - { value: 3, label: "Rabu" }
        - { value: 4, label: "Kamis" }
        - { value: 5, label: "Jumat" }
        - { value: 6, label: "Sabtu" }
        - { value: 7, label: "Minggu" }
    # Satu nilai dari himpunan berlabel: `options` di field skalar. Dipakai
    # untuk menunjukkan cardinality single — `enum_values` tidak punya caption,
    # jadi `qris` tak akan pernah terbaca "QRIS".
    - name: channel
      type: string
      multiple: false
      title: "Kanal"
      description: "Kanal promo dipakai. Kosongkan bila berlaku di semua kanal."
      options:
        - { value: pos, label: "POS" }
        - { value: qris, label: "QRIS" }
        - { value: online, label: "Online" }
    # `time` kini punya `timeinput` — jam happy hour
    # diisi lewat kontrol waktu, bukan teks bebas.
    - name: time_from
      type: time
      title: "Jam Mulai"
    - name: time_to
      type: time
      title: "Jam Selesai"
    - name: max_uses_per_member
      type: integer
      title: "Batas per Member"
    - name: max_uses_total
      type: integer
      title: "Batas Total"
    - name: priority
      type: integer
      default: 0
      title: "Prioritas"
      description: "Dipakai memilih satu promo terbaik bila beberapa cocok (aturan bisnis #7)"
  # expose: [] — UI-only.
