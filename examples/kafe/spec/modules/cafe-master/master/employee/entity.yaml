apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: employee
  module: cafe-master
  description: "Karyawan kafe — kasir, barista, dapur, pelayan, supervisor, manajer"
spec:
  version: v1
  characteristic: master
  plural: employees
  display_field: name
  soft_deactivate: { enabled: true }
  # S5: di sinilah nilai dimensi `branch` berasal. Server membacanya saat
  # menyelesaikan `row_scope: {from: session}` — baris yang `username`-nya sama
  # dengan pemanggil menentukan `branch_id` yang dipakai memfilter.
  assignments:
    - { dimension: branch, field: branch_id, principal_field: username }
  fields:
    - name: name
      type: string
      required: true
      title: "Nama Karyawan"
    - name: phone
      type: string
      title: "Telepon"
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang Tugas"
    - name: position
      type: enum
      enum_values: [kasir, barista, dapur, pelayan, supervisor, manajer]
      required: true
      title: "Posisi"
    # Penaut ke pengguna FormSpec (formspec.core.user). Di sinilah nilai
    # dimensi `branch` berasal: `assignments` di atas dipakai server untuk
    # mengisi atribut sesi `branch_id`, yang kemudian dikonsumsi
    # `row_scope: {from: session}` pada entity ter-scope (S5). Nilai ini juga
    # boleh datang langsung dari klaim `attrs` token.
    - name: username
      type: string
      unique: true
      title: "Username"
      description: "Harus sama dengan username akun login FormSpec"
  # expose: [] — UI-only.
