apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: menu-item-price
  module: cafe-master
  description: "Harga menu per cabang (D1) — memungkinkan satu menu beda harga antar cabang"
spec:
  version: v1
  characteristic: master
  plural: menu-item-prices
  # S5: harga berlaku per cabang — satu menu boleh beda harga antar cabang.
  #
  # Dua permukaan membacanya, dan keduanya butuh cabang yang berbeda sumbernya:
  #   - STAF (POS/kasir): `row_scope` di bawah — cabang dari atribut sesi kasir.
  #     Tanpa ini kasir melihat harga cabang lain, dan picker POS tak punya
  #     pembatas apa pun (dulu hanya `price_filter` klien yang justru tidak
  #     resolve di sana).
  #   - TAMU anonim (katalog QR): `row_scope` entity DILEWATI untuk pemanggil
  #     anonim yang datang dengan scope grant publik (`entityRowScopePredicates`),
  #     dan cabangnya diambil dari SESI TAMU lewat `scope` pada `lookup` picker
  #     `order.lines` → grant turunan `menu-item-price` (10.76). Itu sebabnya
  #     `enforced` di sini tetap menyebut SESI: deklarasi ini menjelaskan
  #     penegakan milik entity, sementara grant menambahkan pembatas per-permukaan
  #     di atasnya.
  scope: { dimension: branch, field: branch_id, required: true }
  row_scope:
    - { field: branch_id, op: eq, from: session }
  fields:
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: menu_item_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.menu-item }
      required: true
      title: "Menu"
    # `money` punya widget `moneyinput` — mata uang ikut
    # terbawa dan jumlahnya tidak dibulatkan saat diketik.
    # Kolom turunan `money` kini membaca `.amount` dan
    # bertipe numerik, jadi `index: true` aman — urutan/rentang atas harga
    # membandingkan angka, bukan teks JSON. Sebelumnya index sengaja tidak
    # dipasang karena `_price text` membuat "9000" > "10000" (gap #23).
    - name: price
      type: money
      index: true
      required: true
      title: "Harga Jual"
    - name: is_active
      type: boolean
      default: true
      title: "Berlaku"
  indexes:
    # Aturan bisnis di bawah DITEGAKKAN database: `indexes:`
    # dihormati dan field `relation` kini menghasilkan kolom turunan saat
    # disebut di sini:
    #   1. satu harga per menu per cabang (entitas ini)
    #   2. satu stock-level per (cabang, bahan)
    - fields: [branch_id, menu_item_id]
      unique: true
  # GUARD — LAPIS KEDUA, bukan pengaman utama.
  # Yang menegakkan aturan ini adalah UNIQUE index di atas (berlaku untuk semua
  # jalur tulis: API, script, seed, operator). Guard ini hanya memberi pesan
  # yang lebih ramah ke pengguna, dan menutup GAP-36 (constraint tidak bisa
  # merapikan duplikat yang sudah ada).
  # Guard memakai `resource.find`, bukan raw SQL.
  # `resource.find` scope-aware, tidak deadlock.
  hooks:
    - on: before
      action: create
      impl: { type: script_ref, ref: cafe-master/guard_menu_item_price_unique }
    - on: before
      action: update
      impl: { type: script_ref, ref: cafe-master/guard_menu_item_price_unique }
  # expose: [] — UI-only.
