apiVersion: formspec.dev/v1
kind: Module
metadata:
  name: cafe-gl-integrator
  description: "Menyambungkan penjualan kafe ke jurnal akuntansi — tanpa entity"
spec:
  version: 1.0.0
  # Depends hanya ke core, TANPA `cafe-order`. Itu disengaja:
  # cafe-order dimiliki App lain (`kafe-pos`), dan menyatakan depends lintas-App
  # akan menyiratkan kepemilikan/instalasi yang tidak benar. Integrator justru
  # ADA untuk membuat kedua sisi tidak saling mengenal — ia menyambung lewat
  # event (`listen`) dan aksi (`call`), bukan lewat dependensi module.
  #
  # GAP-41: karena itu tidak ada tempat mendeklarasikan "saya mengharapkan event
  # `on_paid` dengan payload berisi field X, Y, Z". Kontrak antar-App hanya
  # sekuat nama service yang disepakati.
  depends:
    - module: formspec/core
