apiVersion: formspec.dev/v1
kind: Integrator
metadata:
  name: order-paid-to-journal
  module: cafe-gl-integrator
  description: "Pesanan lunas -> jurnal penjualan di vertical gl"
spec:
  # `listen` + `call` + `compensate` — inilah bentuk deklaratif integrasi
  # lintas-entity yang disediakan FormSpec. Tidak ada entity baru, tidak ada
  # script perekat: hanya pernyataan "ketika X terjadi, panggil Y".
  listen:
    resource: cafe-order.order
    event: on_paid
  call:
    resource: gl.journal-entry
    action: create
  # Jalur pembalikan bila jurnal harus dibatalkan (mis. void setelah lunas).
  #
  # ⚠️ `compensate` SAJA TIDAK CUKUP. `formspec validate` menegakkan aturan
  # integritas 7.7.2: Integrator yang mendengarkan `on_paid` WAJIB punya
  # manifest PASANGAN yang mendengarkan `on_cancel` — lihat
  # `order-cancelled-to-journal-reverse.yaml`. Tanpa itu validasi GAGAL.
  # `IntegratorSpec` hanya punya satu `listen`, jadi simetri tidak bisa
  # dinyatakan dalam satu manifest.
  compensate: gl.journal-entry.cancel
  # ── GAP-41 — TIDAK ADA PEMETAAN PAYLOAD ─────────────────────────────────────
  #
  # `call` hanya menyebut resource + action. TIDAK ADA tempat mendeklarasikan
  # bagaimana field pesanan dipetakan ke field jurnal — padahal keduanya tidak
  # akan pernah punya nama yang sama:
  #
  #   order:  total_amount (money), tax_amount (money), branch_id (relation)
  #   jurnal: debit_account, credit_account, entry_date, lines[] (akun COA)
  #
  # Pemetaan "omzet -> kredit akun 4-1000, pajak -> kredit akun 2-2000,
  # kas -> debit akun 1-1000" adalah PENGETAHUAN AKUNTANSI, bukan penamaan
  # field. Tanpa tempat untuk menyatakannya, ia harus hidup di salah satu sisi:
  #   (a) script milik `gl` (vertical pihak ketiga yang mungkin tidak boleh/
  #       tidak seharusnya diubah), atau
  #   (b) action kustom di sisi kafe yang memanggil gl — yang berarti
  #       integrasinya kembali menempel, dan `kind: Integrator` kehilangan
  #       gunanya.
  #
  # Bentuk yang dibutuhkan: blok pemetaan/transform eksplisit, mis.
  #   call:
  #     resource: gl.journal-entry
  #     action: create
  #     map:
  #       entry_date: "{order.paid_at}"
  #       memo: "Penjualan {order.number}"
  #       lines:
  #         - { account: "1-1000", debit: "{order.total_amount}" }
  #         - { account: "4-1000", credit: "{order.subtotal}" }
  #         - { account: "2-2000", credit: "{order.tax_amount}" }
  #
  # Sampai itu ada, integrasi akuntansi kafe TIDAK bisa dinyatakan penuh secara
  # deklaratif — dan itu berarti "modul akuntansi yang bisa diintegrasikan"
  # (permintaan pemilik kafe) belum benar-benar terpenuhi.
  #
  # S7 (sudah ditetapkan): nilai yang dipetakan adalah `money` (objek
  # {amount, currency}) — operasi `amount(x)` tersedia di script untuk mengambil
  # komponen angkanya (docs/reference/primitives.md, "Dialek Starlark").
  # GAP-35: `gl` berjalan di PostgreSQL pada produksi; tidak ada varian DDL/DML
  # per-driver bila pemetaan ini nanti butuh bantuan SQL.
