apiVersion: formspec.dev/v1
kind: Module
metadata:
  name: gl
  description: Double-entry accounting core
spec:
  version: 1.0.0
  vendor: formspec-dev
  depends:
    - module: formspec/core
  config:
    default_currency: IDR
    fiscal_year_start: "01-01"
  # Default menu suggestion (Core Basic §4.5) — migrated from the old
  # standalone kind: Menu (spec/menus/gl-menu.yaml). "Jurnal Umum"/"Buku
  # Besar"/"Laba Rugi"/"Neraca" have no authored View backing them yet in
  # this vertical, so they stay on the `route` escape hatch unchanged.
  # Default menu suggestion — bentuk diselaraskan dengan schema (`order`
  # adalah properti menu-level, bukan per-child; child hanya {label, icon,
  # route/view}). "Jurnal Umum"/"Buku Besar" memakai `route` (escape hatch):
  # halaman authornya belum ada di vertical ini.
  menu:
    - label: "Akuntansi"
      icon: "calculator"
      children:
        - { label: "Dashboard", icon: "dashboard", view: gl-dashboard }
        - { label: "Jurnal Umum", icon: "book", route: /gl/journal-entries }
        - { label: "Buku Besar", icon: "book-open", route: /gl/accounts }
        - { label: "Neraca Saldo", icon: "file-text", view: trial-balance }
