apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: gl-balance
  module: gl
  description: Saldo per akun per periode — di-update otomatis via reliable event
spec:
  version: v1
  characteristic: summary

  fields:
    - name: account_id
      type: relation
      relation: { type: belongs_to, resource: account }
      immutable: true
    - name: period
      type: string
      immutable: true
      index: true
      description: Periode — "2026-07"
    - name: currency
      type: string
      immutable: true
    - name: opening_balance
      type: decimal
    - name: debit_movement
      type: decimal
      default: 0
    - name: credit_movement
      type: decimal
      default: 0
    - name: closing_balance
      type: decimal
      description: computed — opening + debit - credit (asset) atau opening + credit - debit (liability/revenue)

  # S14: pemelihara proyeksi ini adalah script gl sendiri — invariants
  # menegakkan keunikan baris lewat database (unique index di `indexes:`),
  # bukan disiplin script.
  maintained_by: gl/gl_balance_update
  indexes:
    - fields: [account_id, period, currency]
      unique: true
  invariants:
    - { unique: [account_id, period, currency],
        message: "satu saldo per akun per periode per mata uang" }

  actions:
    # SATU action untuk kedua event. `maintained_by` menunjuk satu script ref,
    # dan hanya script itu yang boleh `resource.upsert` pada entity summary ini
    # (S14/item 4.1) — jadi `journal-posted` dan `journal-reversed` tidak bisa
    # memakai dua action terpisah tanpa duplikat script. Arah penerapannya
    # dibaca dari `journal.status` ("reversed" mengurangi pergerakan), bukan dari
    # nama action; `journal-entry.yaml` sengaja menargetkan action yang sama
    # untuk kedua event.
    - name: update
      description: Dipanggil outbox worker saat journal-posted/journal-reversed — arah dari status jurnal
      idempotent: true
      impl: { type: script_ref, ref: gl/gl_balance_update }
      # Honesty footprint: script membaca jurnal sumber dan bagan akun (both
      # module gl — statically scanned literals, so they are declared anyway).
      uses:
        resources: [gl.journal-entry, gl.account]
