apiVersion: formspec.dev/v1
kind: Form
metadata:
  name: purchase-order-form
  module: cafe-stock
  description: "Susun pesanan pembelian: pilih bahan dari daftar, isi jumlah & harga"
spec:
  entity: cafe-stock.purchase-order
  mode: create
  render:
    mode: separate_page
    # Katalog bahan + panel baris berdampingan: pola entry baris yang sama dengan
    # form QR pesanan. Yang membuatnya bisa adalah `picker` pada child field
    # `lines` (entity), bukan blok khusus.
    picker_panel: aside
  sections:
    - title: "Pembelian"
      fields:
        - { field: supplier_id, widget: relation-picker, label: "Pemasok" }
        - { field: transaction_date, label: "Tanggal" }
        - { field: expected_date, label: "Estimasi Datang" }
        # Landed cost (item 10.1): ongkos kirim satu pengiriman. Dialokasikan
        # proporsional ke harga per satuan bahan saat barang diterima, jadi ia
        # masuk HPP — bukan biaya yang menggantung di luar persediaan.
        - { field: shipping_cost, widget: moneyinput, label: "Biaya Kirim" }
        - { field: note, widget: textarea, label: "Catatan" }
        # `lines` dirender oleh panel picker (kolom kiri). Baris bisa berjenis
        # bahan atau biaya bebas (`line_type`), sehingga ongkos angkut khusus
        # bisa menempel pada bahan tertentu.
        - { field: lines, label: "Bahan & Biaya Dipesan" }
