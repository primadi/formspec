apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: stock-movement
  module: cafe-stock
  description: "Ledger pergerakan bahan (append-only) — SUMBER HPP: unit_cost dibekukan di sini"
spec:
  version: v1
  characteristic: transaction
  plural: stock-movements
  lifecycle: plain_crud
  # S5: pergerakan stok per cabang.
  scope: { dimension: branch, field: branch_id, required: true }
  # Item 3.5.
  row_scope:
    - { field: branch_id, op: eq, from: session }
  fields:
    - name: transaction_date
      type: datetime
      required: true
      index: true
      title: "Waktu Pergerakan"
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: ingredient_id
      type: relation
      relation: { type: belongs_to, resource: cafe-stock.ingredient }
      required: true
      index: true
      title: "Bahan"
    - name: direction
      type: enum
      enum_values: [in, out, adjust]
      required: true
      title: "Arah"
    - name: quantity
      type: decimal
      scale: 3
      required: true
      title: "Jumlah"
    # D3 — INTI perhitungan margin. Nilai dibekukan saat pergerakan:
    #   masuk  (pembelian) -> harga beli
    #   keluar (penjualan) -> biaya rata-rata bergerak saat itu
    # Penjualan TIDAK BOLEH memakai ingredient.cost_per_unit (acuan statis),
    # karena itu membuat margin historis berubah surut.
    # Memakai `moneyinput`. Sisa GAP-02: indeks money.
    - name: unit_cost
      type: money
      required: true
      title: "Biaya per Satuan (beku)"
    - name: total_cost
      type: money
      title: "Total Biaya"
    - name: source
      type: enum
      enum_values: [purchase, sale, waste, opname, manual]
      required: true
      index: true
      title: "Sumber"
    - name: source_ref
      type: string
      index: true
      title: "Referensi Sumber"
      description: "ID pesanan / PO / opname — untuk telusur balik"
    - name: note
      type: string
      title: "Catatan"
  indexes:
    - fields: [branch_id, transaction_date]
    # GAP-11 CATATAN PENTING: JANGAN set `persist.category` berbeda antara
    # stock-movement (operational) dan menu-cost/journal-entry (financial).
    # Resolusi relasi lintas kategori DIBLOKIR SENYAP (log warning saja,
    # bukan error) sehingga label relasi hilang tanpa pesan.
  actions:
    # Aturan bisnis #14: ledger stok bersifat append-only — koreksi lewat
    # pergerakan lawan (adjust), bukan delete.
    - { name: delete, disabled: true }
  # Pemelihara proyeksi `stock-level` (item 4.1). Setiap pergerakan stok
  # memicu script pemelihara, yang meng-upsert saldo & biaya rata-rata
  # bergerak lewat `resource.upsert` (satu-satunya jalur tulis summary).
  # `after` (bukan `before`): baris pergerakan sudah tersimpan, jadi script
  # membaca nilai final (termasuk `unit_cost` yang dibekukan).
  hooks:
    - on: after
      action: create
      impl: { type: script_ref, ref: cafe-stock/stock_level_apply }
      # #34: akses script harus terlihat di consent footprint. Script pemelihara
      # membaca `ingredient.min_stock` (lintas entity satu module) untuk
      # menghitung `is_below_min` — dinyatakan eksplisit di sini.
      uses:
        resources: [cafe-stock.ingredient]
  # expose: [] — UI-only.
