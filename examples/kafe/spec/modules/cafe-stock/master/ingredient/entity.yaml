apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: ingredient
  module: cafe-stock
  description: "Bahan baku kafe — satuan gram/ml/pcs, dasar perhitungan biaya per porsi"
spec:
  version: v1
  characteristic: master
  plural: ingredients
  display_field: name
  soft_deactivate: { enabled: true }
  fields:
    - name: code
      type: string
      required: true
      unique: true
      natural_key: true
      title: "Kode Bahan"
      description: "Mis. BHN-SUSU-01"
    - name: name
      type: string
      required: true
      title: "Nama Bahan"
    - name: unit
      type: enum
      enum_values: [gram, kg, ml, pcs]
      required: true
      default: gram
      title: "Satuan Dasar"
      # S12: nilai gram/kg satu dimensi (massa) dengan basis gram — konversi
      # gram↔kg kini DATA, bukan kesepakatan di dalam script (engine-nya item
      # 4.6). `ml` dan `pcs` berdimensi lain, jadi sengaja tidak dikonversi.
      unit: { base: gram, convertible: [kg], factors: { kg: 1000 } }
    # Biaya acuan. Dipakai HANYA bila bahan belum punya pergerakan stok.
    # Setelah ada pergerakan, acuan biaya adalah stock-level.moving_avg_cost (D3).
    # Memakai `moneyinput`. Sisa GAP-02: indeks money.
    - name: cost_per_unit
      type: money
      title: "Biaya Acuan per Satuan"
    - name: min_stock
      type: decimal
      scale: 3
      default: 0
      title: "Stok Minimum"
      description: "Ambang peringatan stok kritis"
    # Berat per SATUAN DASAR dalam gram — dasar alokasi landed cost berbasis
    # berat (item 10.6). Ongkos kirim mengikuti berat/volume, bukan nilai:
    # PO yang mengirim 50 kg beras bersama 100 g vanili membebani beras jauh
    # lebih banyak daripada proporsi nilainya, dan kolom ini yang membuat itu
    # bisa dinyatakan alih-alih ditebak.
    #
    # Kosong = tidak diketahui. Alokasi berbasis berat akan MENOLAK berjalan
    # bila ada baris yang beratnya tidak diketahui, bukan menganggapnya nol:
    # berat nol berarti bahan itu gratis ongkos kirim, dan itu klaim yang tidak
    # boleh dibuat oleh data yang tidak ada.
    - name: weight_per_unit
      type: decimal
      scale: 3
      title: "Berat per Satuan (gram)"
      description: "Untuk alokasi biaya kirim berbasis berat; kosong = tidak diketahui"
    - name: shelf_life_days
      type: integer
      title: "Umur Simpan (hari)"
  # expose: [] — UI-only.
