apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: stock-level
  module: cafe-stock
  description: "Proyeksi saldo & biaya rata-rata bergerak per (cabang, bahan) — mesin HPP kafe (D3)"
spec:
  version: v1
  characteristic: summary
  plural: stock-levels
  # S5: saldo stok per cabang (dimensi yang sama dengan `stock-movement`).
  scope: { dimension: branch, field: branch_id, required: true }
  # Item 3.5.
  row_scope:
    - { field: branch_id, op: eq, from: session }
  fields:
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: ingredient_id
      type: relation
      relation: { type: belongs_to, resource: cafe-stock.ingredient }
      required: true
      title: "Bahan"
    - name: quantity_on_hand
      type: decimal
      scale: 3
      default: 0
      title: "Saldo"
    # D3: biaya rata-rata bergerak, dihitung script saat pergerakan masuk:
    #   avg = (qty_lama * avg_lama + qty_masuk * biaya_masuk) / (qty_lama + qty_masuk)
    # FormSpec TIDAK punya metode valuasi bawaan (GAP-13) — aritmetika ini
    # sengaja dikerjakan di Starlark supaya laporan margin tidak ikut terblokir.
    # Keterbatasan yang diterima: ini BUKAN FIFO/lapisan.
    - name: moving_avg_cost
      type: money
      title: "Biaya Rata-rata Bergerak"
    - name: stock_value
      type: money
      title: "Nilai Persediaan"
    - name: last_movement_at
      type: datetime
      title: "Pergerakan Terakhir"
    - name: is_below_min
      type: boolean
      default: false
      index: true
      title: "Di Bawah Minimum"
  indexes:
    - fields: [branch_id, ingredient_id]
      unique: true
  # Entity `summary` — create/update/delete permanen dinonaktifkan framework.
  # Hanya script yang menulis entity ini. Itu justru yang menjaga valuasi
  # tetap konsisten (tidak bisa "dibetulkan" manual lewat UI).
  #
  # S14 — kontrak pemelihara. Sebelum ini, entity `summary` hanya bisa
  # MENGKLAIM bahwa seseorang menjaganya: tidak ada tempat menyebutkan SIAPA,
  # dan tidak ada cara memvalidasi klaimnya. Sekarang dua-duanya dinyatakan:
  #   * `maintained_by` menyebut script pemeliharanya, dan validator menolak
  #     referensi yang tidak bisa di-resolve/dikompilasi (bukan komentar).
  #   * `invariants` menyatakan properti yang harus berlaku, dan validator
  #     menolaknya kecuali ada unique index yang benar-benar menopangnya —
  #     jadi yang menegakkan adalah DATABASE, bukan disiplin script.
  #
  # ✅ GAP-33 tertutup (item 4.2): karena penulisan `summary` TIDAK lewat
  # action pipeline, `hooks:` dan `conditions:` pada entity ini TIDAK PERNAH
  # DIPANGGIL — dan sekarang `formspec validate` MENOLAK keduanya di entity
  # `summary` dengan pesan yang menunjuk ke sini. Jadi invarian di bawah dijaga
  # index (DB), sedangkan pola upsert + ctx.lock di script pemelihara adalah
  # urusan script itu sendiri. Kontrak yang didukung: `maintained_by` +
  # `invariants`.
  maintained_by: cafe-stock/stock_level_apply
  invariants:
    - unique: [branch_id, ingredient_id]
      message: "satu saldo per (cabang, bahan)"
  # expose: [] — UI-only.

  # ── Kontrak rebuild (02-core-extended.md §6) ──
  # Proyeksi ini adalah turunan: saldo & biaya rata-rata bergerak dihitung dari
  # pergerakan stok yang digabung ke master bahan.
  sources:
    - { entity: cafe-stock.stock-movement, alias: m }
    - { entity: cafe-stock.ingredient, alias: i }
  join_key: "m.ingredient_id = i.id"
  # `full`: biaya rata-rata bergerak bergantung pada SELURUH riwayat, bukan
  # hanya periode berjalan — rebuild tidak boleh dibatasi jendela sebagian.
  rebuild: { strategy: full }
