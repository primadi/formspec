apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: member-point
  module: cafe-loyalty
  description: "Saldo poin per member (proyeksi) — dasar penukaran poin di kasir"
spec:
  version: v1
  characteristic: summary
  plural: member-points
  fields:
    - name: member_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.member }
      required: true
      title: "Member"
    - name: points_balance
      type: integer
      default: 0
      title: "Saldo Poin"
    - name: lifetime_points
      type: integer
      default: 0
      title: "Total Perolehan"
      description: "Akumulasi seumur hidup — dasar penentuan tier"
    - name: tier
      type: enum
      enum_values: [basic, silver, gold]
      default: basic
      title: "Tingkat"
      description: "Dihitung dari lifetime_points; ambangnya di Config"
    - name: last_activity_at
      type: datetime
      title: "Aktivitas Terakhir"
  indexes:
    - fields: [member_id]
      unique: true
  # Entity `summary` — murni ditulis script (upsert memakai ctx.lock).
  # S14: invariannya ditopang DB (unique index di atas).
  invariants:
    - unique: [member_id]
      message: "satu baris poin per member"
  # expose: [] — UI-only.

  # ── Kontrak rebuild (02-core-extended.md §6) ──
  # Saldo poin adalah akumulasi entri buku besar poin per member.
  sources:
    - { entity: cafe-loyalty.point-entry, alias: p }
    - { entity: cafe-master.member, alias: m }
  join_key: "p.member_id = m.id"
  # `full`: saldo & lifetime_points bergantung pada seluruh riwayat entri poin.
  rebuild: { strategy: full }
