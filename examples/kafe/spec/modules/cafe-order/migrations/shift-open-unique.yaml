apiVersion: formspec.dev/v1
kind: Migration
metadata:
  name: shift-open-unique
  module: cafe-order
  description: "Satu shift terbuka per (cabang, kasir) — aturan bisnis #10 (D6)"
spec:
  module: cafe-order
  # ───────────────────────────────────────────────────────────────────────────
  # INI PENUTUP RESMI untuk aturan bisnis #10.
  #
  # Tidak bisa dinyatakan lewat `indexes:` pada entity karena butuh PARTIAL
  # unique index — `IndexDecl` hanya mendukung {fields, unique}, tanpa predikat.
  # Dan GAP-22 membuat `indexes:` diabaikan seluruhnya, jadi ini juga jalan
  # keluar untuk itu.
  #
  # Konsekuensi: guard script `guard_shift_open_unique.star` menjadi LAPIS
  # KEDUA, bukan pengaman utama. Constraint database berlaku untuk semua jalur
  # tulis (API, script, seed, operator); guard hanya berlaku pada jalur yang
  # melewatinya. Idealnya guard dihapus setelah migration ini terpasang —
  # tapi lihat GAP-36 soal data yang sudah duplikat.
  #
  # ── GAP-35: DDL ini TIDAK PORTABEL ──────────────────────────────────────────
  # `MigrationSpec.ddl` hanya SATU string — tidak ada varian per-driver.
  # Padahal ekspresi JSONB berbeda antar driver:
  #
  #   SQLite      : json_extract(data, '$.branch_id')
  #   PostgreSQL  : (data ->> 'branch_id')
  #
  # Jadi DDL di bawah BENAR untuk dev (SQLite) dan GAGAL di produksi
  # (PostgreSQL). Lihat gaps_found/10-script-dan-hook.md (GAP-35).
  #
  # ── GAP-36: hanya DDL, tanpa perbaikan data ────────────────────────────────
  # "Only DDL statements are allowed — DML is rejected at runtime."
  # Kalau tabel sudah punya baris duplikat, CREATE UNIQUE INDEX akan GAGAL, dan
  # kita TIDAK bisa memperbaiki datanya lewat migration (butuh UPDATE/DELETE =
  # DML). Perbaikan harus manual di luar migration.
  # ───────────────────────────────────────────────────────────────────────────
  ddl: >
    CREATE UNIQUE INDEX idx_uq_cafe_order_shifts_open
    ON cafe_order_shifts (
      tenant_id,
      json_extract(data, '$.branch_id'),
      json_extract(data, '$.cashier_id')
    )
    WHERE deleted_at IS NULL
      AND json_extract(data, '$.status') = 'open'
