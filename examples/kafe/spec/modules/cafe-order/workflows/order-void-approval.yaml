apiVersion: formspec.dev/v1
kind: Workflow
metadata:
  name: order-void-approval
  module: cafe-order
  description: "Persetujuan supervisor wajib untuk membatalkan pesanan yang sudah dibayar (D5)"
spec:
  entity: cafe-order.order
  # Workflow menempel pada TRANSISI state machine, dan transisi dirujuk lewat
  # NAMANYA (`via`), bukan lewat pasangan from/to.
  #
  # Transisi `void-order` punya EMPAT state asal:
  #   from: [paid, in_kitchen, ready, served]  ->  to: cancelled
  # Bentuk lama (`from: paid, to: cancelled`) hanya mengawal SATU state asal —
  # void dari `in_kitchen`/`ready`/`served` lolos approval tanpa error dan tanpa
  # log, padahal itu kasus tersering (makanan sudah dibuat). Satu referensi nama
  # mengawal SELURUH state asal transisi itu sekaligus.
  #
  # `formspec validate` kini menolak pasangan from/to yang hanya mencakup
  # sebagian transisi — jadi bentuk lama itu tidak bisa kembali tanpa ketahuan.
  on:
    transition:
      name: void-order
  on_reject:
    # Ditolak supervisor -> kembali ke state asal, pesanan tetap berjalan.
    # `on_reject.to` menerima state tunggal: workflow ini mengawal empat state
    # asal, dan FormSpec memulihkan state asal aslinya otomatis.
    to: paid
  # `WorkflowStep` kini punya `title`,
  # `description`, dan `display_fields` — jadi tugas approval punya label yang
  # menjelaskan APA yang sedang disetujui, dan field pendukung yang approver
  # butuhkan untuk memutuskan (nomor pesanan, total, alasan void) tanpa membuka
  # record sendiri. `formspec validate` menolak `display_fields` yang menunjuk
  # field yang tidak ada di entity.
  steps:
    # Peran, bukan nama pengguna: permission = resource + action; role adalah
    # konsep IAM. `cafe-order.supervisor` memetakan ke employee berposisi
    # supervisor/manajer (lihat module cafe-master).
    - title: "Persetujuan Void Pesanan"
      description: "Periksa nomor pesanan, total, dan alasan void sebelum menyetujui. Void dari dapur/ready/served berarti makanan sudah dibuat."
      display_fields: [number, total_amount, void_reason]
      roles: [cafe-order.supervisor]
      approvers: 1
      mode: any
      escalation:
        # Void yang menggantung berarti status pesanan tidak jelas — layar kasir
        # dan dapur akan berbeda pendapat. Jadi eskalasi wajib ada.
        after: "4h"
        notify_roles: [cafe-order.manajer]
