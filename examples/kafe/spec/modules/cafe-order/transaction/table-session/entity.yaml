apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: table-session
  module: cafe-order
  description: "Satu kunjungan pelanggan di satu meja — induk pesanan QR dan pemegang token akses pelanggan"
spec:
  version: v1
  characteristic: transaction
  plural: table-sessions
  display_field: guest_token
  lifecycle: plain_crud
  # S5: sesi tamu berjalan di satu cabang. Perhatikan: ini deklarasi dimensi,
  # BUKAN filter — token tamu tetap `row_scope from: route` (S3/item 2.2),
  # sedangkan penyaringan otomatis per permukaan adalah item 3.5.
  scope: { dimension: branch, field: branch_id, required: true }
  fields:
    - name: transaction_date
      type: datetime
      required: true
      index: true
      title: "Waktu Mulai Sesi"
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: dining_table_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.dining-table }
      required: true
      title: "Meja"
    # GAP-06: ini PENGAMAN PENGGANTI, bukan desain ideal. App `access: public`
    # memberi anonim `list`/`find` untuk SELURUH entity di module yang di-mount,
    # sehingga tanpa token ini pelanggan bisa membaca pesanan meja lain.
    # Idealnya: allowlist publik per-entity + scoping per-record.
    #
    # `natural_key: true` (2026-09-27): token inilah identitas bisnis sesi, dan
    # itu yang membuat halaman masuk QR bisa mengarahkan tamu ke
    # `/menu/{token}` (#37) — `GET .../table-session/{token}` me-resolve lewat
    # `WHERE _guest_token = ?`. Sebelumnya token hanya bisa dipakai sebagai
    # FILTER (`?guest_token=`), bukan sebagai alamat, sehingga halaman menu
    # tidak punya cara menyebut sesi yang baru dibuat.
    - name: guest_token
      type: string
      required: true
      natural_key: true
      title: "Token Tamu"
      description: "Token acak — kunci akses pelanggan ke pesanan & struk digitalnya"
    - name: guest_name
      type: string
      title: "Nama Tamu"
    - name: guest_count
      type: integer
      default: 1
      title: "Jumlah Orang"
    - name: member_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.member }
      title: "Member"
      description: "Diisi bila tamu memasukkan nomor HP terdaftar"
    - name: closed_at
      type: datetime
      title: "Waktu Selesai"
    - name: status
      type: enum
      enum_values: [open, closed, abandoned]
      default: open
      index: true
      title: "Status"
  state_machine:
    field: status
    initial: open
    states:
      - { name: open, label: "Terbuka" }
      - { name: closed, label: "Selesai" }
      - { name: abandoned, label: "Ditinggalkan" }
    transitions:
      # Gate di TRANSISI (2026-09-27): action-nya tanpa `impl`, jadi tidak ada
      # route yang memeriksa `required_permission` — jalur penerapannya
      # `PATCH status`, yang hanya diperiksa `{plural}.update`.
      - { from: open, to: closed, via: close-session, require_permission: table-sessions.close-session }
      - { from: open, to: abandoned, via: abandon, require_permission: table-sessions.abandon }
  actions:
    - { name: submit, disabled: true }
    - name: close-session
      description: "Tutup sesi meja (meja jadi kosong)"
      audit: true
      # Guard ideal: semua order di sesi ini sudah tidak ada yang berstatus
      # draft/awaiting_payment. Logika lintas-record -> script hook, bukan expr.
    - name: abandon
      description: "Tandai sesi ditinggalkan"
      audit: true
  # 10.34c — satu sesi TERBUKA per meja. Tanpa ini satu meja bisa menampung
  # sesi terbuka tanpa batas: terukur 4 sesi dari 4 request. Pola yang sama
  # sudah dipakai `shift` (`where: "status = 'open'"`, S8) dan portabel antar
  # driver (SQLite & PostgreSQL sama-sama mendukung partial index).
  #
  # `dining_table_id` sudah field top-level, jadi index atas field relasi
  # berlaku sejak 3.1/#22 — tidak perlu kolom baru.
  indexes:
    - fields: [dining_table_id]
      unique: true
      where: "status = 'open'"
  # Intake anonim (10.36): halaman QR boleh membuat sesi tanpa login, jadi
  # pembatasannya per-IP. Tanpa ini satu skrip bisa membuat sesi di semua meja.
  rate_limit: { max: 20, per: 1m, scope: ip }
  # expose: [] — UI-only.
