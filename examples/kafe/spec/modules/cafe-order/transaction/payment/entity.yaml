apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: payment
  module: cafe-order
  description: "Pembayaran per pesanan — satu pesanan bisa punya beberapa baris (bayar sebagian / metode gabungan)"
spec:
  version: v1
  characteristic: transaction
  plural: payments
  lifecycle: plain_crud
  # S5: pembayaran mengikuti cabang pesanannya.
  scope: { dimension: branch, field: branch_id, required: true }
  # Item 3.5.
  row_scope:
    - { field: branch_id, op: eq, from: session }
  fields:
    - name: transaction_date
      type: datetime
      required: true
      index: true
      title: "Waktu Bayar"
    - name: order_id
      type: relation
      relation: { type: belongs_to, resource: cafe-order.order }
      required: true
      index: true
      title: "Pesanan"
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: method
      type: enum
      enum_values: [cash, card, qris, ewallet, points]
      required: true
      title: "Metode Bayar"
    # Memakai `moneyinput`. Sisa GAP-02: indeks money.
    - name: amount
      type: money
      required: true
      title: "Jumlah Dibayar"
    - name: tendered
      type: money
      title: "Uang Diterima"
      description: "Hanya untuk tunai — dasar hitung kembalian"
    - name: change
      type: money
      title: "Kembalian"
      computed:
        formula: "tendered - amount"
    - name: reference_no
      type: string
      title: "No. Referensi"
      description: "Nomor referensi EDC / QRIS"
    - name: status
      type: enum
      enum_values: [pending, settled, failed, refunded]
      default: pending
      index: true
      title: "Status"
    - name: shift_id
      type: relation
      relation: { type: belongs_to, resource: cafe-order.shift }
      title: "Shift"
    - name: cashier_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.employee }
      title: "Kasir"
    - name: refund_reason
      type: string
      title: "Alasan Refund"
  state_machine:
    field: status
    initial: pending
    states:
      - { name: pending, label: "Menunggu" }
      - { name: settled, label: "Lunas" }
      - { name: failed, label: "Gagal" }
      - { name: refunded, label: "Dikembalikan" }
    transitions:
      # ── Gate di transisi, BUKAN di action ──
      #
      # Ketiga transisi ini tidak punya `impl`, jadi actionnya tidak punya route
      # sendiri: jalur penerapannya `PATCH status`, yang diperiksa
      # `cafe-order.payments.update`. Tanpa `require_permission` di sini,
      # `required_permission` pada action **tidak ditegakkan di mana pun** —
      # terukur 2026-09-27: pelayan (hanya punya `update`) berhasil menjalankan
      # `awaiting_payment -> paid` pada `order`.
      #
      # `refund` adalah **uang keluar**; `settle` menandai lunas. Keduanya tidak
      # boleh jatuh ke pemegang `update` biasa.
      - { from: pending, to: settled, via: settle, description: "Tandai pembayaran lunas", require_permission: payments.settle }
      - { from: pending, to: failed, via: fail, description: "Tandai pembayaran gagal", require_permission: payments.fail }
      # Refund dijalankan supervisor (aturan bisnis di roles.yaml).
      - { from: settled, to: refunded, via: refund, description: "Kembalikan pembayaran ini — butuh persetujuan supervisor", require_permission: payments.refund }
  actions:
    # Aturan bisnis #14: jejak pembayaran tidak dihapus — koreksi lewat refund.
    - { name: delete, disabled: true }
    - { name: submit, disabled: true }
  # expose: [] — UI-only.
