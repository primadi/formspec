apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: shift
  module: cafe-order
  description: "Shift kasir — kas awal, penjualan, kas masuk/keluar, dan selisih saat tutup"
spec:
  version: v1
  characteristic: transaction
  plural: shifts
  lifecycle: plain_crud
  # S5: shift milik satu cabang (dan satu kasir).
  scope: { dimension: branch, field: branch_id, required: true }
  # Item 3.5: supervisor hanya melihat shift cabangnya; `read_all` untuk pemilik.
  row_scope:
    - { field: branch_id, op: eq, from: session }
  fields:
    - name: transaction_date
      type: date
      required: true
      index: true
      title: "Tanggal Shift"
    - name: branch_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.branch }
      required: true
      title: "Cabang"
    - name: cashier_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.employee }
      required: true
      title: "Kasir"
    - name: opened_at
      type: datetime
      title: "Waktu Buka"
    - name: closed_at
      type: datetime
      title: "Waktu Tutup"
    # Kas awal & uang hitung kini pakai `moneyinput` —
    # form tutup shift bisa diisi tanpa keluar dari numpad.
    - name: opening_cash
      type: money
      required: true
      title: "Kas Awal"
    - name: expected_cash
      type: money
      title: "Kas Seharusnya"
      description: "compute: kas awal + tunai masuk - kas keluar"
    - name: counted_cash
      type: money
      title: "Kas Hasil Hitung"
    - name: difference
      type: money
      title: "Selisih"
      computed:
        formula: "counted_cash - expected_cash"
    - name: status
      type: enum
      enum_values: [open, closed]
      default: open
      index: true
      title: "Status"
    - name: supervisor_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.employee }
      title: "Supervisor Penyetuju"
    - name: note
      type: text
      title: "Catatan Selisih"
  state_machine:
    field: status
    initial: open
    states:
      - { name: open, label: "Terbuka" }
      - { name: closed, label: "Tutup" }
    transitions:
      - { from: open, to: closed, via: close-shift }
  actions:
    # Aturan bisnis #14: shift tidak dihapus — rekonsiliasi kas harus utuh.
    - { name: delete, disabled: true }
    - { name: submit, disabled: true }
    - name: close-shift
      description: "Tutup shift: hitung fisik, tampilkan selisih, konfirmasi (Wizard)"
      required_permission: shifts.close-shift
      audit: true
  indexes:
    - fields: [branch_id, transaction_date]
    # ATURAN BISNIS #10 — satu shift terbuka per (cabang, kasir).
    # Dinyatakan sebagai PARTIAL unique index (S8): hanya baris `status: open`
    # yang diindeks, jadi satu kasir boleh punya banyak shift tertutup tapi
    # hanya satu yang terbuka. Sebelumnya ini hanya bisa dinyatakan lewat DDL
    # mentah (`kind: Migration` shift-open-unique) yang tidak portabel antar
    # driver; sekarang jadi konstruk bahasa spec dan portabel (SQLite &
    # PostgreSQL sama-sama mendukung partial index).
    - fields: [branch_id, cashier_id]
      unique: true
      where: "status = 'open'"
  # Guard script di bawah adalah LAPIS KEDUA: ia memberi pesan error yang ramah
  # di action pipeline. Constraint database di atas yang berlaku untuk semua
  # jalur tulis (API, script, seed, operator).
  # GAP-30: deadlock di SQLite (dev).
  hooks:
    - on: before
      action: create
      impl: { type: script_ref, ref: cafe-order/guard_shift_open_unique }
  # expose: [] — UI-only.
