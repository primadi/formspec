apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: order
  module: cafe-order
  description: "Pesanan kafe — inti transaksi. Hanya pesanan LUNAS yang masuk dapur (aturan bisnis #1)."
spec:
  version: v1
  characteristic: transaction
  plural: orders
  display_field: number
  lifecycle: plain_crud
  # S5: pesanan milik satu cabang. Ini juga yang membuat `scope_field` di
  # natural_key_rule punya acuan generik (item 3.6).
  scope: { dimension: branch, field: branch_id, required: true }
  # Item 3.5: penyaringan dinyalakan. Kasir hanya melihat pesanan cabangnya,
  # nilainya diselesaikan server dari `employee.branch_id` (TIDAK bisa
  # dilebarkan lewat query string), dan pemegang
  # `cafe-order.orders.read_all` (pemilik/auditor) sengaja dilewati.
  # Permukaan publik (halaman status tamu) TIDAK terpengaruh: permintaan
  # anonim di route itu memakai scope dari grant turunan (dari `param` route
  # pada Table block halaman status) — lihat `api.applyRowScope`.
  row_scope:
    - { field: branch_id, op: eq, from: session }
  fields:
    # Nomor pesanan per CABANG (scope_field) — bukan deret global.
    # Jalur script kini juga ber-scope
    # (`ctx.next_key("number", scope=branch_id)`), dan keunikannya ikut ber-scope
    # (`tenant_id, _branch_id, _number`), sehingga `ORD-…-00001` sah ada di dua
    # cabang sekaligus. Sebelumnya index uniknya tanpa cabang → cabang kedua
    # gagal 500.
    #
    # `auto_generated`: nomor pesanan adalah identitas yang dibuat sistem, bukan
    # input kasir — form POS menguncinya (`read_only`) dan nilai yang dikirim
    # caller diabaikan, supaya tidak ada yang bisa mematok nomor yang nanti
    # diberikan deret kepada pesanan lain. `unique` tidak ditulis: `natural_key`
    # sudah mengimplikasikannya.
    - name: number
      type: string
      required: true
      natural_key: true
      natural_key_entry: auto_generated
      natural_key_rule:
        strategy: sequence
        format: "ORD-{year}-{seq:05d}"
        reset: yearly
        scope_field: branch_id
      title: "Nomor Pesanan"
    - name: transaction_date
      type: datetime
      required: true
      index: true
      title: "Waktu Pesan"
    - name: branch_id
      type: relation
      relation:
        type: belongs_to
        resource: cafe-master.branch
        # Denormalisasi finansial (02-core-extended.md §1.1, todo 7.10):
        # konfigurasi pajak & service charge cabang DISALIN ke pesanan saat
        # dibuat. Ini bukan sekadar cache — `computed` hanya boleh membaca
        # field record itu sendiri (`evaluateComputed` berjalan SEBELUM relasi
        # di-resolve, jadi `branch.tax_percent` tidak tersedia di formula),
        # sehingga tanpa salinan ini rantai nilai di bawah mustahil dihitung.
        # Efek sampingnya yang memang diinginkan: pesanan lama tidak berubah
        # nilai pajaknya bila tarif cabang diubah kemudian.
        snapshot:
          - { from: tax_percent, as: tax_percent }
          - { from: service_charge_percent, as: service_charge_percent }
          - { from: apply_service_charge, as: apply_service_charge }
      required: true
      title: "Cabang"
    - name: channel
      type: enum
      enum_values: [qr_table, cashier, takeaway]
      default: cashier
      required: true
      title: "Kanal"
    - name: table_session_id
      type: relation
      relation: { type: belongs_to, resource: cafe-order.table-session }
      index: true
      title: "Sesi Meja"
      description: "Wajib bila channel = qr_table"
    # Kunci milik tamu (#45): disalin dari sesi meja saat pesanan dibuat anonim,
    # lalu dipakai scope grant turunan pada App publik untuk membatasi
    # `list` anonim ke baris ini saja. Tanpa field ini, "anonim boleh list"
    # berarti seluruh pesanan kafe — dan itulah kenapa `list` publik dulu tidak
    # diberikan sama sekali.
    - name: guest_token
      type: string
      index: true
      title: "Token Tamu"
      description: "Kunci akses pesanan bagi pelanggan anonim (ikut sesi meja)"
    - name: dining_table_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.dining-table }
      title: "Meja"
      description: "Denormalisasi untuk tampilan cepat"
    - name: member_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.member }
      title: "Member"
    - name: employee_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.employee }
      title: "Kasir/Pelayan"
    - name: shift_id
      type: relation
      relation: { type: belongs_to, resource: cafe-order.shift }
      title: "Shift"
      # Wajib bila channel = cashier (aturan bisnis #11).
      description: "Shift kasir yang menangani pesanan ini."
    - name: status
      type: enum
      enum_values:
        [draft, awaiting_payment, paid, in_kitchen, ready, served, completed, cancelled]
      default: draft
      index: true
      title: "Status"
    # ── Rincian nilai (D8: disimpan terpisah, bukan satu angka) ──
    # Seluruh money di bawah kini memakai widget
    # `moneyinput` (numpad, mata uang ikut terbawa).
    # `subtotal` sudah diturunkan server-side dari baris pesanan (S7 menetapkan
    # aritmetika money, jadi `sum` atas money sah). Rantai diskon/pajak menuju
    # `total_amount` KINI diturunkan (rantai di bawah): subtotal (dari baris,
    # sudah turunan) + service charge + pajak − diskon opsional. Sebelum ini ia
    # tidak punya penulis sama sekali, sehingga jurnal GL, laporan penjualan,
    # struk, dan kolom Total kosong untuk setiap pesanan (kafe 10.65).
    # Tarif pajak & service charge cabang, DISALIN saat pesanan dibuat
    # (`snapshot:` pada `branch_id` di atas). Ia ada sebagai field karena
    # `computed` tidak bisa membaca entity lain; lihat komentar rantai nilai di
    # bawah.
    - name: tax_percent
      type: percent
      scale: 2
      title: "Pajak Cabang (%)"
      description: "Tarif PB1 cabang saat pesanan dibuat."
    - name: service_charge_percent
      type: percent
      scale: 2
      title: "Service Charge Cabang (%)"
      description: "Tarif service charge cabang saat pesanan dibuat."
    - name: apply_service_charge
      type: boolean
      title: "Pakai Service Charge"
      description: "Apakah cabang ini menerapkan service charge."
    - name: subtotal
      type: money
      title: "Subtotal"
      computed:
        formula: 'sum([i["line_total"] for i in lines])'
    - name: promo_id
      type: relation
      relation: { type: belongs_to, resource: cafe-master.promo }
      title: "Promo"
    - name: discount_amount
      type: money
      title: "Total Diskon"
    - name: manual_discount_amount
      type: money
      title: "Diskon Manual"
    - name: manual_discount_reason
      type: string
      title: "Alasan Diskon Manual"
      # Wajib bila diskon manual melebihi batas di Config (aturan bisnis #8).
      description: "Alasan diskon ini diberikan."
    - name: points_redeemed
      type: integer
      title: "Poin Ditukar"
    - name: points_value
      type: money
      title: "Nilai Poin"
    - name: service_charge_amount
      type: money
      title: "Service Charge"
      description: "Service charge cabang ini, dihitung dari subtotal."
      # computed: branch.service_charge_percent × subtotal — tapi hanya bila
      # cabang menerapkan service charge; selain itu nol bermata uang sama.
      #
      # `if … else money_zero(subtotal)`, bukan `… else 0`: aritmetika money
      # menolak campuran money+number (05-field-types.md §2.1, "tidak ada
      # koersi diam-diam"), jadi cabang "tidak ada" harus tetap bertipe money.
      # `money_zero(x)` mengambil mata uang dari operand, bukan hardcode IDR.
      computed:
        formula: 'resource.subtotal * resource.service_charge_percent / 100 if resource.apply_service_charge else money_zero(resource.subtotal)'
    - name: tax_amount
      type: money
      title: "Pajak"
      description: "Pajak PB1 cabang ini."
      # computed: branch.tax_percent × (subtotal + service charge) — basis
      # mengikuti komentar field ini sejak awal; lihat changelog 2026-10-03-003
      # untuk perubahan angka yang ditimbulkannya.
      computed:
        formula: '(resource.subtotal + resource.service_charge_amount) * resource.tax_percent / 100'
    - name: total_amount
      type: money
      # Kolom turunan money numerik (membaca `.amount`),
      # jadi sortir/rentang atas total sah diandalkan.
      #
      # ⚠️ `computed` dievaluasi saat BACA, bukan dipersist — jadi kolom
      # turunan `_total_amount` tetap NULL dan `?sort=total_amount`
      # mengurutkan NULL. Sisa yang tercatat (kafe 10.68 ⏸️).
      index: true
      title: "Total"
      # Rantai nilai lengkap. Setiap operand opsional dibaca lewat `resource.`
      # (FieldMap → `None` bila field tidak ada), sebab menyebut field yang
      # absen sebagai identifier adalah error compile yang lalu DIAM-DIAM
      # membuat field ini kosong — akar masalah 10.65.
      #
      # Diskon dijumlahkan lewat `sum([...])`: `sum` mengabaikan `None` dan
      # tetap berada di jalur money selama ada satu elemen money (anchor
      # `money_zero`), jadi pesanan tanpa diskon tidak jatuh ke penjumlahan
      # angka.
      computed:
        formula: 'resource.subtotal + resource.service_charge_amount + resource.tax_amount - sum([money_zero(resource.subtotal), resource.discount_amount, resource.manual_discount_amount, resource.points_value])'
    - name: paid_amount
      type: money
      title: "Sudah Dibayar"
    - name: change_amount
      type: money
      title: "Kembalian"
    - name: guest_note
      type: text
      title: "Catatan Tamu"
    - name: void_reason
      type: string
      title: "Alasan Void"
    - name: void_approved_by
      type: relation
      relation: { type: belongs_to, resource: cafe-master.employee }
      title: "Disetujui Oleh"
    # ── Baris pesanan ──
    # D2 (denormalisasi finansial): nama & harga DIBEKUKAN saat pesan, supaya
    # struk lama tidak berubah bila harga menu naik. Wajib per
    # 02-core-extended.md §1.1.
    - name: lines
      type: child
      child:
        storage: jsonb
        sequence_field: line_no
        # Baris diisi dengan MEMILIH dari katalog menu, bukan mengetik satu per
        # satu (S1). Deklarasinya ada di sini — di field, bukan di halaman —
        # sehingga Form mana pun yang mengedit entity ini mendapatkannya, dan
        # jalur tulis tetap milik Form.
        picker:
          entity: cafe-master.menu-item
          filter: { is_available: "true" }
          display:
            name_field: name
            image_field: photo
            description_field: description
            category_field: menu_category_id
            # Harga per CABANG ada di entity terpisah → join client-side.
            price_entity: cafe-master.menu-item-price
            price_match_field: menu_item_id
            price_field: price
            price_filter: { branch_id: "{session.branch_id}" }
            columns: 3
            search: true
            empty_text: "Menu belum tersedia"
          map:
            ref_field: menu_item_id
            # Snapshot D2: nama & harga dibekukan saat dipilih.
            name_field: name_snapshot
            price_field: unit_price_snapshot
            quantity_field: quantity
            note_field: note
            max_quantity: 20
        fields:
          - name: line_no
            type: integer
            title: "No."
          - name: menu_item_id
            type: relation
            relation: { type: belongs_to, resource: cafe-master.menu-item }
            required: true
            title: "Menu"
          - name: name_snapshot
            type: string
            required: true
            title: "Nama Menu (beku)"
          - name: unit_price_snapshot
            type: money
            required: true
            title: "Harga (beku)"
          - name: quantity
            type: integer
            required: true
            default: 1
            title: "Qty"
          - name: prep_station
            type: enum
            enum_values: [bar, kitchen, both]
            default: bar
            title: "Stasiun"
          - name: discount_amount
            type: money
            title: "Diskon Baris"
          - name: line_total
            type: money
            title: "Subtotal Baris"
            # Diturunkan server-side: harga BEKU dikali jumlah. Dua operand-nya
            # wajib, jadi tidak ada operand kosong yang membuat evaluasi gagal.
            computed:
              formula: "quantity * unit_price_snapshot"
          - name: line_status
            type: enum
            enum_values: [queued, preparing, ready, served]
            default: queued
            title: "Status Baris"
            description: "Dapur/bar bisa menyelesaikan per item, bukan hanya per pesanan"
          - name: note
            type: string
            title: "Catatan"
  # Intake anonim (10.36): tamu memesan dari QR tanpa login, jadi pembatasannya
  # per-IP — satu skrip tidak bisa membanjiri pesanan.
  rate_limit: { max: 30, per: 1m, scope: ip }
  state_machine:
    field: status
    initial: draft
    states:
      - { name: draft, label: "Draf" }
      - { name: awaiting_payment, label: "Menunggu Bayar" }
      - { name: paid, label: "Lunas" }
      - { name: in_kitchen, label: "Diproses" }
      - { name: ready, label: "Siap" }
      - { name: served, label: "Disajikan" }
      - { name: completed, label: "Selesai" }
      - { name: cancelled, label: "Dibatalkan" }
    transitions:
      - { from: draft, to: awaiting_payment, via: submit-order, require_permission: orders.submit-order }
      - { from: draft, to: cancelled, via: abandon, require_permission: orders.abandon }
      # Keterkaitan transisi↔event kini
      # DINYATAKAN EKSPLISIT lewat `emit:` — bukan disimpulkan dari penamaan.
      # `formspec validate` menolak `emit` yang menunjuk event yang tidak
      # dideklarasikan, jadi tidak ada lagi "nama event = nama state" yang
      # hanya kebetulan.
      # GATE WAJIB (temuan 2026-09-27): tanpa `require_permission`, transisi
      # ini hanya diperiksa `cafe-order.orders.update` — TERUKUR kasir (tanpa
      # `confirm-payment` sama sekali) berhasil `PATCH status=paid` → **200**.
      # Itu jalur uang: siapa pun pemegang `update` bisa menandai pesanan LUNAS.
      # `required_permission` di blok `actions:` tidak menolong — action tanpa
      # `impl` tidak punya route, jadi tidak ada yang memeriksanya
      # (`formspec check` menandai bentuk ini sebagai warning).
      - { from: awaiting_payment, to: paid, via: confirm-payment, emit: on_paid, require_permission: orders.confirm-payment }
      - { from: awaiting_payment, to: cancelled, via: cancel-order, emit: on_cancel, require_permission: orders.cancel-order }
      # ── Gate peran dapur/pelayan (temuan 2026-09-27) ──
      #
      # Empat transisi ini membentuk PEMISAHAN PERAN (dapur menyiapkan, pelayan
      # menyajikan) tetapi hanya dijaga `cafe-order.orders.update` — dan grant
      # `order-page` barista/dapur/pelayan semuanya berisi `update`, jadi
      # ketiganya bisa menjalankan keempatnya. Satu nama action hanya bermakna
      # bila permission-nya mengikat.
      - { from: paid, to: in_kitchen, via: start-preparing, require_permission: orders.start-preparing }
      - { from: in_kitchen, to: ready, via: mark-ready, require_permission: orders.mark-ready }
      # `emit: on_served` (2026-09-27): meja berubah `served` lewat jalur yang
      # SAMA dengan `occupied` — pelayan mengantar, status meja ikut. Tidak ada
      # impl/route baru: urusan meja dibaca konsumen event.
      - { from: ready, to: served, via: mark-served, emit: on_served, require_permission: orders.mark-served }
      - { from: served, to: completed, via: complete-order, require_permission: orders.complete-order }
      # Void setelah pembayaran menyentuh uang (refund) — digerbangi sama.
      #
      # `params.inputs` (plan action-input-contract): kontrak input yang bisa
      # DIRENDER. Sebelum ini `void-order` hanya punya `conditions` yang membaca
      # `params.get('void_reason')` di sisi action — deklarasi yang tampak
      # menuntut alasan tetapi tidak punya satu pun permukaan yang bisa
      # mengumpulkannya: tombol transisi POST tanpa body, dan `void_reason`
      # adalah field entity yang tak pernah terisi di jalur ini.
      #
      # `void_reason` di sini MERUJUK field entity (baris ~167) — tipe, title,
      # dan enum-nya tidak diulang. `required_when` menjaga satu deklarasi tetap
      # cukup untuk keempat state asal: alasan wajib, dan `persist` bawaannya
      # menyimpan nilainya bersama perpindahan state (termasuk melewati approval
      # supervisor, yang menyimpan input pemohon di baris approval).
      - from: [paid, in_kitchen, ready, served]
        to: cancelled
        via: void-order
        emit: on_cancel
        require_permission: orders.void-order
        params:
          inputs:
            - name: void_reason
              widget: textarea
              required_when: "fields.status == 'paid'"
          render: { mode: modal }
        # D5: void setelah bayar WAJIB lewat approval supervisor. Gate ini dulu
        # manifest `kind: Workflow` terpisah; kini ia dideklarasikan DI transisi
        # yang di-gate, sehingga transisi multi-origin ini tercover utuh by
        # construction dan deklarasi tidak bisa menyimpang dari yang di-gate.
        # Duty `supervisor-check` di-qualify jadi
        # `workflow.cafe-order.order.void-order.supervisor-check`, dan grant di
        # `modules/formspec.core/seeds/roles.yaml` yang memberikannya.
        approval:
          steps:
            - name: supervisor-check
              permission: supervisor-check
              title: "Persetujuan Void Pesanan"
              description: "Periksa nomor pesanan, total, dan alasan void sebelum menyetujui. Void dari dapur/ready/served berarti makanan sudah dibuat."
              display_fields: [number, total_amount, void_reason]
              approvers: 1
              mode: any
              # Reassign = duty (permission), bukan nama role: hak takeover
              # pindah ke pemegang `manager-check` setelah 4 jam, dan siapa
              # memegangnya ditentukan grant di `seeds/roles.yaml` — cabut grant
              # itu, cabut hak takeover-nya, tanpa menyentuh manifest ini.
              escalation:
                after: "4h"
                reassign: manager-check
          # Ditolak supervisor -> kembali ke state asal; pesanan tetap berjalan.
          on_reject: { to: paid }
  # ── Event — pemicu integrasi lintas-app (stok & jurnal) ──
  # Transisi memancarkan event lewat `emit:`
  # yang DINYATAKAN di state machine di atas. Nama event tetap berkonvensi
  # (`on_*` = async, `before_*` = sync) — konvensi penamaan dan keterkaitan
  # eksplisit kini dua hal yang terpisah dan keduanya terverifikasi.
  events:
    - name: on_paid
      description: "Pesanan lunas — pemicu integrasi stok & jurnal"
      type: async
      publish: { durable: true }
      deliver:
        # reliable_event = jaminan tertinggi (outbox). Wajib di sini: jurnal
        # akuntansi tidak boleh hilang, dan pesanan tetap tercatat walau
        # integrasi gagal (retry + dead-letter menanganinya).
        - channel: reliable_event
    # Nama `on_cancel` BUKAN pilihan bebas: `formspec validate` menegakkan aturan
    # integritas (7.7.2) — Integrator yang mendengarkan `on_paid` WAJIB punya
    # pasangan cancel, kalau tidak pembatalan di sisi sumber akan diblokir
    # permanen. Nama yang dikenali validator: `on_cancel` / `before_cancel`.
    # Ini aturan yang bagus: memaksa pemikirkan pembalikan SEJAK awal, bukan
    # setelah ada 3.000 jurnal yang tidak bisa dibatalkan.
    - name: on_cancel
      description: "Pesanan dibatalkan setelah dibayar — pemicu jurnal pembalik"
      type: async
      publish: { durable: true }
      deliver:
        - channel: reliable_event
    # `on_served` — pemicu "meja disajikan". Bukan event uang (seperti on_paid),
    # jadi ia tidak menuntut pasangan cancel: pembalikannya adalah pembayaran
    # BERIKUTNYA dari sesi yang sama (`on_paid` → meja kembali `occupied`), dan
    # itu memang sudah ada.
    - name: on_served
      description: "Pesanan disajikan ke tamu — pemicu status meja `served`"
      type: async
      publish: { durable: true }
      deliver:
        - channel: reliable_event
  actions:
    # Aturan bisnis #14: data penjualan TIDAK pernah dihapus permanen.
    # Koreksi lewat pembatalan (cancel-order / void-order), bukan delete.
    - { name: delete, disabled: true }
    - { name: submit, disabled: true }
    # ── submit-order / abandon ──
    #
    # Gate-nya hidup di TRANSISI (2026-09-27). `required_permission` pada action
    # tanpa `impl` tidak menegakkan apa pun: action itu tidak punya route, dan
    # jalur penerapannya `PATCH status` hanya diperiksa `{plural}.update`.
    # Deskripsi + `audit` tetap di sini — audit adalah properti ACTION, dieksekusi
    # pipeline action saat action berjalan.
    - name: submit-order
      description: "Konfirmasi pesanan & hitung subtotal/pajak/service charge/promo"
      audit: true
    - name: abandon
      description: "Tinggalkan keranjang"
    # `required_permission` DIHAPUS dari sini (2026-09-27): action ini tidak
    # punya `impl`, jadi tidak punya route — permission-nya tidak akan pernah
    # diperiksa di sini. Gate-nya hidup di transisi
    # (`state_machine.transitions[].require_permission`), dan menulisnya di dua
    # tempat ditolak `spec.ValidateTransitionPermissions` karena keduanya bisa
    # menyimpang. `audit` tetap di sini: audit adalah properti ACTION (dieksekusi
    # pipeline action saat action berjalan).
    - name: confirm-payment
      description: "Pesanan LUNAS — di sinilah pesanan masuk dapur"
      audit: true
    - name: cancel-order
      # Batal sebelum bayar (aturan bisnis #11: shift harus masih terbuka).
      description: "Batalkan pesanan yang belum dibayar."
      audit: true
      conditions:
        - script: "True"
          message: "Guard ideal: shift terkait masih berstatus open"
    # ── start-preparing / mark-ready / mark-served / complete-order ──
    #
    # Entri `actions:`-nya DIHAPUS (2026-09-27): gate-nya kini hidup di
    # transisi. `required_permission` pada action tanpa `impl` tidak menegakkan
    # apa pun — tidak ada route yang memeriksanya, dan jalur penerapannya
    # `PATCH status` diperiksa `{plural}.update`. Gate transisi diperiksa pada
    # jalur itu. Menulis keduanya ditolak validator. Nama, deskripsi, dan
    # permission-nya tetap ada lewat transisi, yang sejak L3 adalah action penuh.
    - name: void-order
      # WAJIB lewat approval supervisor (D5).
      description: "Batalkan pesanan yang sudah dibayar — perlu persetujuan supervisor."
      audit: true
      conditions:
        - script: "len(params.get('void_reason', '')) > 0"
          message: "Alasan void wajib diisi"
  # expose: [] — UI-only.
