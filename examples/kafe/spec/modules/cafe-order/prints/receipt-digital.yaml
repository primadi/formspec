apiVersion: formspec.dev/v1
kind: Print
metadata:
  name: receipt-digital
  module: cafe-order
  description: "Struk digital (html) — Pelanggan membuka halaman status lalu mencetak"
spec:
  entity: cafe-order.order
  # `html` dirender di browser lewat `window.print()` + CSS @media print.
  # Format PDF & thermal juga berjalan server-side sejak 7.1, jadi pilihan
  # format disesuaikan dengan alat cetak yang dipakai.
  output:
    format: html
    paper: { size: A4 }
  header:
    title: "KAFE KAMI — {branch.name}"
    subtitle: "Struk Digital"
  body:
    - fields: [number, transaction_date, channel]
    - child_table:
        field: lines
        columns: [name_snapshot, quantity, unit_price_snapshot, line_total]
    - separator: "-"
    - fields: [subtotal, discount_amount, service_charge_amount, tax_amount]
    - totals: { field: total_amount, format: currency }
    # QR struk untuk membuka halaman status
    # pesanan. `absolute: true` menambahkan origin halaman (browser) sehingga
    # payload-nya URL yang bisa dipindai ponsel.
    - qrcode:
        payload: "/kafe/status/{guest_token}"
        label: "Buka struk digital"
        absolute: true
        size_mm: 30
    - fields: [paid_amount, change_amount, member_id]
  footer:
    text: "Terima kasih — {branch.receipt_footer}"
