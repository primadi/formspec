apiVersion: formspec.dev/v1
kind: Print
metadata:
  name: receipt-thermal
  module: cafe-order
  description: "Struk pelanggan 58mm — dokumen cetak utama kafe"
spec:
  entity: cafe-order.order
  # `format: thermal` kini benar-benar
  # menghasilkan byte stream ESC/POS (58mm), bukan PDF bernama .pdf.
  # `internal/api/print.go` bercabang pada `output.format`: `thermal` →
  # `renderPrintThermal` (ESC/POS: init, align, bold, cut), `pdf` →
  # `renderPrintPDF`, `html` → dirender klien oleh PrintRenderer, dan format
  # lain (`dotmatrix`) ditolak `501 NOT_IMPLEMENTED` — bukan diam-diam jadi PDF.
  output:
    format: thermal
    paper: { size: thermal_58mm }
  header:
    logo: false
    title: "KAFE KAMI"
    # {branch.name} memakai interpolasi dot-path — diresolve server-side.
    subtitle: "{branch.name}"
  body:
    - fields: [number, transaction_date, dining_table_id, employee_id]
    - separator: "--------------------------------"
    # child_table memakai baris item pesanan. name_snapshot & unit_price_snapshot
    # adalah nilai yang DIBEKUKAN saat pesan (D2) — struk lama tidak berubah
    # bila harga menu naik.
    - child_table:
        field: lines
        columns: [name_snapshot, quantity, unit_price_snapshot, line_total]
    - separator: "--------------------------------"
    # Baris pajak & service charge ditampilkan TERPISAH (keputusan D8) — bukan
    # ditanam di harga, supaya kepatuhan pajak jelas di struk.
    - fields: [subtotal, discount_amount, service_charge_amount, tax_amount]
    - totals: { field: total_amount, format: currency }
    - fields: [paid_amount, change_amount]
    # Pelanggan memindai struk kertas
    # untuk membuka halaman status pesanannya; QR yang sama juga ada di struk
    # digital (receipt-digital.yaml).
    #
    # `absolute: true` menambahkan origin dokumen yang dicetak, dan `/kafe/`
    # adalah prefix workspace (`kafe`) + `root_url: /` milik App `kafe-qr` —
    # jalur itu diverifikasi hidup (`/kafe/status/x` → 200). Origin TIDAK
    # disimpan di entity karena ia pengetahuan deployment, bukan data.
    #
    # Order yang dibuat di kasir tidak punya `guest_token`, jadi struknya
    # tercetak tanpa QR — bukan QR yang menuju `/status/` lalu tampak berfungsi
    # (aturan "token tak ter-resolve = elemen dihilangkan", engine yang menegakkan).
    - qrcode:
        payload: "/kafe/status/{guest_token}"
        label: "Struk digital"
        absolute: true
        size_mm: 25
  footer:
    text: "Terima kasih — {branch.receipt_footer}"
