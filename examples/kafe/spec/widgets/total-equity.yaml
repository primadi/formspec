# Total equity widget
apiVersion: formspec.dev/v1
kind: Widget
metadata:
  name: total-equity
  module: gl
spec:
  title: "Total Ekuitas"
  type: metric
  entity: ledger
  query: "account_type = 'equity'"
  refresh_secs: 300
  config:
    aggregate: sum
    field: ending_balance
    format: currency
