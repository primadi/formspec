# Inventory menu — warehouse management navigation
apiVersion: forma.dev/v1alpha1
kind: Menu
metadata:
  name: inventory-main
  module: inventory
  description: Menu navigasi Inventory
spec:
  label: "Inventory"
  icon: "package"
  order: 20
  children:
    - label: "Dashboard"
      icon: "dashboard"
      route: "/app/inventory/dashboard"
      order: 1
    - label: "Stok"
      icon: "boxes"
      route: "/app/inventory/stock"
      order: 2
    - label: "Mutasi Stok"
      icon: "arrows-left-right"
      route: "/app/inventory/movements"
      order: 3
    - label: "Laporan"
      icon: "file-text"
      order: 4
      children:
        - label: "Kartu Stok"
          route: "/app/inventory/reports/stock-card"
        - label: "Laporan Mutasi"
          route: "/app/inventory/reports/movement"
