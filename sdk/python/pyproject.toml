[project]
name = "lib-forma"
version = "0.1.0"
description = "Thin client SDK bridging a Python app to forma-sidecar: /invoke listener + ctx.* proxy client"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib_forma*"]
