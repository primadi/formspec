[package]
name = "lib-formspec"
version = "0.1.0"
edition = "2021"
description = "Thin Rust SDK for formspec-sidecar communication: /invoke listener + ctx.* proxy client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["unix"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "lib_formspec"
path = "src/lib.rs"
