apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: module
  module: registry
  description: "Module — katalog module FormSpec yang dipublikasikan ke registry"
spec:
  version: v1
  characteristic: master
  lifecycle: plain_crud
  display_field: name
  plural: modules
  fields:
    - name: name
      type: string
      required: true
      unique: true
      natural_key: true
      title: "Module Name"
      description: "metadata.name module (mis. billing) — unik di registry"
    - name: display_name
      type: string
      required: true
      title: "Display Name"
    - name: description
      type: text
      title: "Description"
    - name: vendor_id
      type: relation
      relation: { type: belongs_to, resource: registry.vendor }
      required: true
      title: "Vendor"
    - name: trust_tier
      type: enum
      enum_values: [community, verified, official]
      default: community
      title: "Trust Tier"
      description: "community (default) | verified (lolos review 13.3.5) | official (ditandatangani FormSpec)"
    - name: ai_index
      type: text
      title: "AI Index"
      description: "Deskripsi untuk discovery AI (untrusted input — 04-formspec-remote-mcp.md §3.1)"
  expose:
    - type: rest
      actions: [list, find, create, update, submit]
  actions:
    - name: create
      required_permission: registry.module.create
    - name: update
      required_permission: registry.module.update
