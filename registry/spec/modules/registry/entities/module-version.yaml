apiVersion: formspec.dev/v1
kind: Entity
metadata:
  name: module-version
  module: registry
  description: "ModuleVersion — satu rilis module: tarball, checksum tree, signature ed25519"
spec:
  version: v1
  characteristic: transaction
  lifecycle: plain_crud
  display_field: semver
  plural: module-versions
  fields:
    - name: module_id
      type: relation
      relation: { type: belongs_to, resource: registry.module }
      required: true
      index: true
      title: "Module"
    - name: semver
      type: string
      required: true
      unique: true
      title: "Version"
      description: "Semver (mis. 1.0.0) — unik per module (field 'version' adalah reserved framework)"
    - name: transaction_date
      type: date
      required: true
      title: "Published At"
      description: "Tanggal rilis versi (field transaction_date wajib untuk characteristic transaction)"
    - name: checksum
      type: string
      required: true
      title: "Tree Checksum"
      description: "sha256 tree checksum isi tarball (format internal/vendor TreeChecksum)"
    - name: signature
      type: text
      required: true
      title: "Ed25519 Signature"
      description: "Signature ed25519 (base64) atas checksum — diverifikasi registry saat publish (13.3.3)"
    - name: signer_public_key
      type: text
      required: true
      title: "Signer Public Key"
      description: "Public key ed25519 penanda tangan (base64)"
    - name: tarball
      type: file
      title: "Tarball"
      storage:
        allowed_types: [.tar.gz, .tgz, application/gzip]
        max_size_mb: 50
        visibility: private
    - name: changelog
      type: text
      title: "Changelog"
    - name: status
      type: enum
      enum_values: [draft, published, deprecated]
      default: draft
      title: "Status"
      exclude: [ui]
  state_machine:
    field: status
    initial: draft
    states:
      - { name: draft, label: "Draft" }
      - { name: published, label: "Published" }
      - { name: deprecated, label: "Deprecated" }
    transitions:
      - { from: draft, to: published, via: publish }
      - { from: published, to: deprecated, via: deprecate }
  actions:
    - name: submit
      disabled: true
    - name: publish
      description: "Publikasikan versi — verifikasi signature (13.3.3) wajib lulus sebelum transisi"
      required_permission: registry.moduleversion.publish
      audit: true
    - name: deprecate
      description: "Tandai versi tidak lagi direkomendasikan"
      required_permission: registry.moduleversion.deprecate
      audit: true
  expose:
    - type: rest
      actions: [list, find, create]
