apiVersion: formspec.dev/v1
kind: App
metadata:
  name: registry
  description: "FormSpec Module Registry — portal publik katalog module + admin surface derived (/_admin)"
spec:
  version: 0.2.0
  vendor: formspec-dev
  title: "FormSpec Registry"
  logo: "package"
  root_url: /
  app_renderer: no-nav
  access: public
  # no-nav default-nya tanpa nav & tanpa auth controls (frontend/
  # 05-app-kinds.md §4.1) — portal ini opt-in keduanya secara eksplisit.
  chrome:
    nav: menu
    auth: links
  stack_family: react-shadcn
  persist_backend: jsonb-persist
  modules:
    - registry
    - portal
  menu:
    - { label: "Beranda", route: /, module: portal }
    - { label: "Module", route: /listing/module-catalog, module: portal }
    # Sign in/Sign up dirender oleh no-nav shell — jangan duplikasi di menu.
